openapi: 3.0.3

info:
  title: ShardX Browser — Automation API
  version: "0.1.0"
  description: |
    Локальний HTTP API для автоматизації антидетект-браузера ShardX:
    генерація відбитків, створення/запуск/зупинка профілів, отримання
    Chrome DevTools Protocol (CDP) WebSocket-ендпоінта для керування
    запущеним профілем через Puppeteer / Playwright.

    ## Прив'язка та життєвий цикл
    Сервер працює всередині застосунку-лаунчера, слухає лише **127.0.0.1**
    на порту, заданому в *Settings → Automation API* (за замовчуванням **40325**).
    З інших хостів він **недоступний**. Зміна порту та включення/відключення
    набувають чинності після перезапуску застосунку.

    ## Аутентифікація
    Усі ендпоінти, крім `GET /health`, вимагають **Bearer JWT** (HS256,
    підписаний секретом лаунчера):

        Authorization: Bearer <token>

    Постійний токен відображається в *Settings → Automation API* (скопіюйте
    його звідти). Кнопка **Regenerate token** миттєво ротує підписуючий
    секрет: новий токен починає працювати одразу, всі раніше видані токени
    стають недійсними. Окремого API-ключа та ендпоінта для видачі
    токенів немає — сам токен і є обліковим записом.

    Відсутній/невірний токен → `401` з порожнім тілом.

    ## Типовий сценарій
    1. `GET /fingerprint/new/{platform}` → повністю унікалізований відбиток
       (випадкова platform_version, CPU/RAM з урахуванням хоста, обрізаний
       екран, шум по векторах), **не** зберігається.
    2. За бажанням відредагувати повернутий об'єкт `fingerprint` (наприклад,
       увімкнути `noise.fonts.enabled`, задати `webrtc`, виправити `navigator`).
    3. `POST /profiles` (або `POST /folders/{folder}/profiles`) з цим об'єктом
       як `fingerprint` → лаунчер зберігає його **як є**
       (create ніколи не перерандомізує).
    4. `POST /profiles/{id}/start` → повертає CDP-ендпоінт; підключайтеся як
       `browserWSEndpoint = cdp.web_socket_debugger_url`.
    5. `POST /profiles/{id}/stop` після завершення.

    ## Проксі та QUIC/WebRTC
    При **кожному** запуску (через UI або API), до старту браузера, прив'язаний
    проксі перевіряється живцем на UDP-relay (SOCKS5 UDP_ASSOCIATE). Якщо UDP
    працює — вмикається QUIC, а WebRTC може використовувати проксований
    UDP-relay; якщо ні — QUIC вимикається, WebRTC переводиться в режим
    TCP-only, щоб реальний IP не витік. Поля часового поясу, локалі та
    геолокації в режимі `auto` також підтягуються живцем через проксі при
    запуску. Якщо передати `proxy` (рядок) при постійному створенні —
    проксі додається у сховище та проходить повний тест; тимчасовий профіль
    зберігає проксі інлайн.

    ## Тимчасові профілі
    `POST /profiles/temporary` створює профіль із прапорцем `temporary`: він
    прихований з `GET /profiles` та інтерфейсу лаунчера, а після закриття
    браузера видаляється автоматично (конфіг + папка даних). Якщо застосунок
    впаде поки профіль відкритий — він буде видалений при наступному запуску.

    ## Об'єкт fingerprint
    `fingerprint`, що повертається `GET /fingerprint/new*` та приймається
    ендпоінтами створення — це нативний FingerprintConfig лаунчера. Він
    передається дослівно, тому схема нижче документує типові
    підоб'єкти, але навмисно відкрита (`additionalProperties: true`).

    ## MCP-сервер
    Окремий **MCP** (Model Context Protocol) сервер дозволяє AI-клієнту
    керувати лаунчером через *цей* API, а браузером профілю — по CDP.
    Це самостійний Node-процес — **не** частина даного HTTP API і
    не хоститься ним. Завантажити можна прямо з лаунчера
    (**Settings → MCP server → Download MCP server** або кнопка «Download MCP»
    на боковій панелі); лаунчер збереже вихідники у вибрану папку.
    Також доступний у репозиторії: `rust/shardx-launcher/mcp/`.

    Під капотом він просто викликає цей API: налаштуйте
    `SHARDX_API` (базовий URL) та `SHARDX_TOKEN` (Bearer-токен з
    *Settings → Automation API*). MCP-сервер надає:
    - **API-інструменти** — тонкі обгортки над ендпоінтами нижче
      (профілі, відбитки, проксі, папки, cookies, запуск/зупинка).
    - **Браузерні інструменти** (patchright поверх CDP) — `browser_navigate`,
      `browser_evaluate`, `browser_screenshot`, `browser_click`,
      `browser_fill`, вкладки, очікування тощо, застосовуються до профілю,
      запущеного через `POST /profiles/{id}/start` (який повертає
      CDP-ендпоінт).

    Запуск: або через **stdio** (клієнт стартує його сам), або через HTTP
    на `127.0.0.1:<port>/mcp` (якщо задано `MCP_HTTP_PORT`). Детальніше —
    в README MCP-сервера. (Лаунчер лише завантажує його; не запускає.)

servers:
  - url: http://127.0.0.1:40325
    description: Локальний лаунчер (порт за замовчуванням; змінюється в Settings)

security:
  - bearerAuth: []

tags:
  - name: System
  - name: Fingerprints
  - name: Profiles
  - name: Folders
  - name: Proxies
  - name: Extensions
  - name: Bookmarks
  - name: Trash
  - name: Automation

paths:
  /health:
    get:
      tags: [ System ]
      summary: Перевірка доступності сервера
      description: Повертає базову інформацію про сервер. Єдиний ендпоінт, **не** що вимагає аутентифікації.
      security: []
      responses:
        "200":
          description: Сервер працює.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  name: { type: string, example: shardx-launcher }
                  version: { type: string, example: "0.1.0" }

  /fingerprint/new:
    get:
      tags: [ Fingerprints ]
      summary: Згенерувати новий відбиток (ОС хоста)
      description: |
        Повертає повністю унікалізований відбиток для **хостової**
        операційної системи без збереження. Еквівалентно виклику
        `/fingerprint/new/{platform}` з платформою хоста.
      responses:
        "200":
          description: Унікалізований, не збережений відбиток.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerprintEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Бібліотека відбитків порожня.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /fingerprint/new/{platform}:
    get:
      tags: [ Fingerprints ]
      summary: Згенерувати новий відбиток для заданої платформи
      description: |
        Вибирає випадковий відбиток з бібліотеки, що відповідає `platform`,
        потім унікалізує його: нова `platform_version` для Sec-CH-UA,
        `hardware_concurrency`/`device_memory` з урахуванням хоста (не перевищують
        реальні значення машини), екран, обрізаний під реальний дисплей.
        Повертається без збереження — передайте як `fingerprint` в ендпоінт створення.
      parameters:
        - name: platform
          in: path
          required: true
          description: Регістронезалежно; приймаються псевдоніми `win`/`osx`/`darwin`.
          schema:
            type: string
            enum: [ Windows, macOS, Linux ]
      responses:
        "200":
          description: Унікалізований, не збережений відбиток.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerprintEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Підходящий відбиток не знайдено або бібліотека порожня.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles:
    get:
      tags: [ Profiles ]
      summary: Список профілів
      description: |
        Повертає постійні профілі (тимчасові приховані), від нових до старих,
        закріплені — вгорі. Кожен запис доповнено актуальним станом запуску.
      responses:
        "200":
          description: Список профілів.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Profiles ]
      summary: Створити профіль
      description: |
        Зберігає профіль із переданого клієнтом об'єкта `fingerprint` **точно
        як є** (повторна рандомізація не виконується — унікалізація вже
        відбулася в `/fingerprint/new`). Використовуйте `folder`, щоб розмістити
        профіль у папці; прив'яжіть проксі за `proxy_id` зі сховища або
        інлайн через `proxy` (рядок, **не** зберігається у сховищі проксі).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "200":
          description: Метадані створеного профілю.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "400":
          description: Відсутній або не є об'єктом `fingerprint`, або нерозбірлива строка проксі.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/temporary:
    post:
      tags: [ Profiles ]
      summary: Створити тимчасовий профіль
      description: |
        Створює профіль із випадкового (або вказаного) відбитка бібліотеки,
        унікалізованого як в `/fingerprint/new` і збереженого дослівно,
        з прапорцем `temporary`: прихований зі списків і **автоматично видаляється
        після закриття браузера** (або при наступному запуску після краша).
        Використовуйте разом із `POST /profiles/{id}/start`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TempProfileRequest" }
      responses:
        "200":
          description: Створений тимчасовий профіль.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  fingerprint_id:
                    type: string
                    description: Запис бібліотеки, на основі якого згенеровано профіль.
                  temporary: { type: boolean, example: true }
                  proxy_inline:
                    type: boolean
                    description: Чи був прикріплений інлайн-проксі.
        "400":
          description: Unparseable proxy string, or an unknown noise vector.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Підходящий відбиток не знайдено / порожня бібліотека.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}:
    get:
      tags: [ Profiles ]
      summary: Отримати профіль
      description: |
        Повертає повний збережений профіль: оболонку `_meta` плюс
        розгорнутий FingerprintConfig. Якщо профіль запущений — додаються
        `running` та `cdp`.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Збережений профіль.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Профіль не знайдено.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [ Profiles ]
      summary: Видалити профіль
      description: |
        Moves the profile to the trash, where it stays restorable for 7 days
        before it is swept. What is archived is the account — cookies, logins,
        web data, preferences, Local Storage, IndexedDB — not the caches, so
        the archive is a fraction of the user-data dir. The original config and
        user-data dir are removed once the archive is written.

        Temporary profiles are torn down by the process tracker when their
        browser closes and never reach the trash.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Moved to the trash.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string, format: uuid }
                  trashed:
                    type: boolean
                    example: true
                    description: Restorable from the launcher's Trash for 7 days.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Помилка при видаленні.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [ Profiles ]
      summary: Редагувати профіль
      description: |
        Оновлює лише передані поля. Якщо передано `fingerprint` — він
        ЗАМІНЮЄ збережений дослівно (без перерандомізації).
        `folder: ""` прибирає профіль з папки; `proxy_id: ""` від'єднує проксі;
        рядок `proxy` зберігається (дедуплікація) + проходить повний тест,
        потім прив'язується. Повертає оновлений профіль.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditProfileRequest" }
      responses:
        "200":
          description: Оновлений збережений профіль.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredProfile" }
        "400":
          description: Невірний fingerprint (не об'єкт) або нерозбірливий проксі.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Профіль не знайдено.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/start:
    post:
      tags: [ Profiles ]
      summary: Запустити профіль (з CDP)
      description: |
        Запускає ShardX-браузер для профілю з увімкненим remote-debugging,
        підставляє часовий пояс/локаль/гео з `auto`-полів через прив'язаний
        проксі та повертає CDP-ендпоінт після того, як Chrome записав
        DevToolsActivePort. CDP вмикається **лише** при запуску через API
        (запуски з UI не відкривають налагоджувальний порт — антидетект не страждає).
        `cdp` дорівнює `null`, якщо ендпоінт не вдалося прочитати протягом
        таймауту. Працює для звичайних та тимчасових профілів.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: false
        description: Необов'язково. Порожнє тіло запускає у графічному режимі.
        content:
          application/json:
            schema:
              type: object
              properties:
                headless:
                  type: boolean
                  default: false
                  description: Запустити в headless-режимі (--headless=new).
      responses:
        "200":
          description: Запущено.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string }
                  pid: { type: integer, format: int64, description: PID процесу ОС. }
                  headless: { type: boolean }
                  cdp:
                    nullable: true
                    allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]
                  cdp_error:
                    type: string
                    nullable: true
                    description: >
                      Why `cdp` is null, when it is. Absent otherwise.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Бінарний файл не налаштований / не вдалося запустити процес.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/stop:
    post:
      tags: [ Profiles ]
      summary: Зупинити профіль
      description: |
        Відправляє браузеру сигнал graceful shutdown (SIGTERM на Unix; 5 секунд
        очікування, потім SIGKILL). Тимчасові профілі видаляються в процесі закриття.
        `stopped` дорівнює `false`, якщо профіль не був запущений.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Команда зупинки відправлена.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string }
                  stopped: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/{id}/cookies:
    get:
      tags: [ Profiles ]
      summary: Експортувати cookies
      description: |
        Читає сховище cookies Chromium профілю та повертає всі cookies
        **у розшифрованому вигляді**. Працює як для запущеного, так і для
        зупиненого профілю. Порожній масив, якщо профіль жодного разу не запускався.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Cookies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cookies:
                    type: array
                    items: { $ref: "#/components/schemas/Cookie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Помилка читання або розшифрування БД cookies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [ Profiles ]
      summary: Імпортувати cookies
      description: |
        Записує cookies у сховище профілю (повторно шифруючи за схемою
        Chromium v10). Профіль **повинен бути зупинений** — запущений браузер
        перезапише сховище при виході та затре імпорт.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ cookies ]
              properties:
                cookies:
                  type: array
                  items: { $ref: "#/components/schemas/Cookie" }
      responses:
        "200":
          description: Імпортовано.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer, description: Кількість записаних cookies. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Профіль запущений — спочатку зупиніть його.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Помилка запису БД cookies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /folders:
    get:
      tags: [ Folders ]
      summary: Список папок
      description: Унікальні непорожні теги папок серед постійних профілів.
      responses:
        "200":
          description: Назви папок.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
                example: [ "work", "scrapers" ]
        "401": { $ref: "#/components/responses/Unauthorized" }

  /folders/{folder}:
    patch:
      tags: [ Folders ]
      summary: Перейменувати папку
      description: Перевішує тег на всіх профілях у папці. Повертає кількість задіяних профілів.
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name ]
              properties:
                name: { type: string, description: Нова назва папки. }
      responses:
        "200":
          description: Перейменовано.
          content:
            application/json:
              schema:
                type: object
                properties:
                  renamed_to: { type: string }
                  profiles: { type: integer, description: Кількість перетегованих профілів. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [ Folders ]
      summary: Видалити папку
      description: |
        Видаляє тег папки. При `delete_profiles=true` профілі всередині теж
        видаляються; інакше вони переходять до «Усі» (тег знімається).
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: delete_profiles
          in: query
          required: false
          description: Видалити профілі з папки (за замовчуванням false = зняти тег).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Видалено.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_folder: { type: string }
                  delete_profiles: { type: boolean }
                  profiles: { type: integer, description: Кількість задіяних профілів. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /folders/{folder}/profiles:
    post:
      tags: [ Folders ]
      summary: Створити профіль у папці
      description: |
        Те саме, що `POST /profiles`, але папка береться з шляху
        (переоприділяє `folder` у тілі запиту).
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "200":
          description: Метадані створеного профілю.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "400":
          description: Відсутній або не є об'єктом `fingerprint`, або нерозбірлива строка проксі.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fingerprints:
    get:
      tags: [ Fingerprints ]
      summary: Список відбитків бібліотеки
      description: Бібліотека відбитків на диску (GPU-пресети), що постачається/імпортується лаунчером.
      responses:
        "200":
          description: Записи бібліотеки.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LibraryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /running:
    get:
      tags: [ Profiles ]
      summary: Список запущених профілів
      description: Профілі з живим процесом браузера, включаючи CDP-ендпоінт при запуску через API.
      responses:
        "200":
          description: Запущені профілі.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunningProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /proxies:
    get:
      tags: [ Proxies ]
      summary: Список збережених проксі
      description: Проксі, збережені у сховищі лаунчера. **Облікові дані (логін/пароль) не повертаються.**
      responses:
        "200":
          description: Коротка інформація про проксі.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProxySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Proxies ]
      summary: Додати проксі
      description: |
        Додає проксі у сховище (з дедуплікацією за ендпоінтом). Передайте
        рядок `proxy` або явні поля `host`/`port` (+ `kind`/`username`/`password`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProxyRequest" }
      responses:
        "200":
          description: Коротка інформація про збережений проксі.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxySummary" }
        "400":
          description: Нерозбірливий проксі / не вказані host та port.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /proxies/{id}:
    delete:
      tags: [ Proxies ]
      summary: Видалити проксі
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Видалено.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /extensions:
    get:
      tags: [ Extensions ]
      summary: List the extension library
      description: |
        Extensions available to profiles. The `id` of each is what
        `POST /profiles` and `PATCH /profiles/{id}` take in `extensions`.

        Icons are omitted here: a data URL runs to hundreds of kilobytes and a
        listing of thirty would be mostly base64. `POST /extensions` returns
        the icon for the one it just added.
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Extension" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Extensions ]
      summary: Add an extension
      description: |
        Give either `url` or `path`.

        `url` takes a Chrome Web Store page, a bare 32-character extension id,
        or a direct link to a `.crx` / `.zip`; the launcher resolves the store
        page to the download itself. `path` takes a local `.crx`, `.zip`, or an
        unpacked folder on the machine running the launcher.

        Name, version, description and icon come out of the extension's own
        `manifest.json` — including `__MSG_*__` placeholders, resolved against
        its default locale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddExtensionRequest" }
      responses:
        "200":
          description: Added; `icon` is populated on this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extension" }
        "400":
          description: Neither `url` nor `path` given, the link is not an extension, or the store has no such id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /extensions/{id}:
    delete:
      tags: [ Extensions ]
      summary: Remove an extension
      description: |
        Profiles hold ids, not copies, so any profile naming this extension
        stops loading it from its next launch. Their stored list is left as it
        is — re-adding the extension does not restore the binding.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookmarks:
    get:
      tags: [ Bookmarks ]
      summary: List folder bookmarks
      responses:
        "200":
          description: Every bookmark, across folders.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bookmark" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Bookmarks ]
      summary: Add or update a bookmark
      description: |
        With `id` it updates that bookmark; without, it creates one.

        A bookmark bound to a folder appears in the bookmarks bar of every
        profile in that folder, inside a folder called **ShardX**; `folder: ""`
        means every profile. Only that folder is managed, so bookmarks the
        operator saved inside a profile are untouched.

        Applied when a profile next launches — the file is written just before
        the browser reads it, so a running profile does not see the change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkRequest" }
      responses:
        "200":
          description: The saved bookmark.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "400":
          description: No URL given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookmarks/{id}:
    delete:
      tags: [ Bookmarks ]
      summary: Delete a bookmark
      description: It leaves its profiles on their next launch.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trash:
    get:
      tags: [ Trash ]
      summary: List deleted profiles
      description: |
        Profiles `DELETE /profiles/{id}` archived, newest first, each with the
        instant it stops being restorable. The sweep runs at launcher startup.
      responses:
        "200":
          description: The trash.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrashEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trash/{id}/restore:
    post:
      tags: [ Trash ]
      summary: Restore a deleted profile
      description: |
        Puts the profile back under its **own id**, so a script, a bookmark
        folder or a proxy binding that referenced it still points at it. The
        archive is removed once the profile is back.

        What returns is the account — cookies, logins, web data, preferences,
        history, bookmarks, Local Storage, IndexedDB. Caches were never
        archived and are rebuilt on the next launch.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The restored profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Nothing in the trash under that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /trash/{id}:
    delete:
      tags: [ Trash ]
      summary: Delete a trashed profile for good
      description: Irreversible — the archive is the only remaining copy.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Purged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged: { type: boolean, example: true }
                  id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects:
    get:
      tags: [ Automation ]
      summary: List automation projects
      description: |
        Every project saved in the launcher, with its blocks and run settings.
        These are the same projects the desktop **Automation** section edits.
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Automation ]
      summary: Create an empty project
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: "Empty gives \"Untitled\"." }
      responses:
        "200":
          description: The new project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects/{id}:
    get:
      tags: [ Automation ]
      summary: Get one project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [ Automation ]
      summary: Replace a project
      description: |
        Whole-project replace: send it back the way `GET` returned it. The id
        in the path wins over the one in the body, and an id that does not
        exist is a `404` rather than a silent create — use `POST
        /automation/projects` to make one.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationProject" }
      responses:
        "200":
          description: The saved project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "400":
          description: The body is not a project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [ Automation ]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/duplicate:
    post:
      tags: [ Automation ]
      summary: Copy a project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/export:
    get:
      tags: [ Automation ]
      summary: Export a project as a bundle
      description: |
        Parameters the project marked secret are emptied on the way out, so a
        bundle can be handed on without taking a password with it. The import
        side asks for them again.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The bundle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationBundle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/import:
    post:
      tags: [ Automation ]
      summary: Import a project bundle
      description: The bundle arrives as a new project with a new id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationBundle" }
      responses:
        "200":
          description: The imported project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "400":
          description: Not a bundle, or a version this build does not read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects/{id}/run:
    post:
      tags: [ Automation ]
      summary: Start a project
      description: |
        Answers as soon as the run is under way — the browsers it needs are
        started by the project's own blocks. Poll `/status` for progress.

        A project already running is a `400`; so is one with no enabled steps.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: { type: string, format: uuid }
                  running: { type: boolean, example: true }
        "400":
          description: Already running, or nothing to run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: This launcher was built without automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/stop:
    post:
      tags: [ Automation ]
      summary: Stop a project
      description: |
        Asks the run to stop. Each browser finishes the step it is in and then
        closes, so the run does not disappear the instant this answers — watch
        `running` on `/status`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stopping.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: { type: string, format: uuid }
                  stopping: { type: boolean, example: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: This launcher was built without automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/status:
    get:
      tags: [ Automation ]
      summary: How a run is going
      description: |
        `null` when the project is not running and has not run since the
        launcher started. The log is the tail the fleet window shows; the whole
        thing is on disk under `automation-runs/`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The run state, or null.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AutomationRun"
                  - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: This launcher was built without automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/runs:
    get:
      tags: [ Automation ]
      summary: Every run going right now
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: This launcher was built without automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/modules:
    get:
      tags: [ Automation ]
      summary: List installed modules
      description: |
        Modules are WebAssembly an operator wrote themselves; each contributes
        blocks under the kind `module:<module id>:<block>`. A module never
        touches the page — it answers with actions the runner performs.
      responses:
        "200":
          description: The modules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationModule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: This launcher was built without automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [ Automation ]
      summary: Install a module
      description: |
        `path` is a `.wasm` file **on this machine** — the API is local, and a
        module is native code the operator built themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ path ]
              properties:
                path: { type: string, example: "/home/me/module.wasm" }
      responses:
        "200":
          description: The installed module.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationModule" }
        "400":
          description: No path, or the file is not a module this build can load.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: This launcher was built without automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/modules/{id}:
    delete:
      tags: [ Automation ]
      summary: Remove a module
      description: Projects using its blocks stop working; nothing rewrites them.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such module.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: This launcher was built without automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Постійний JWT з Settings → Automation API.

  parameters:
    ProfileId:
      name: id
      in: path
      required: true
      description: UUID профілю.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Відсутній або недійсний Bearer-токен.

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [ error ]

    FingerprintEnvelope:
      type: object
      properties:
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
      required: [ fingerprint ]

    Fingerprint:
      type: object
      description: |
        Нативний FingerprintConfig. Задокументовані підоб'єкти — найпоширеніші;
        об'єкт відкритий і зберігається ендпоінтами створення
        дослівно, тому будь-яке поле тут буде передано без змін.
      additionalProperties: true
      properties:
        name: { type: string }
        notes: { type: string }
        seed:
          type: integer
          description: 0 = режим лише перевизначень (типовий випадок).
        navigator:
          type: object
          additionalProperties: true
          properties:
            user_agent: { type: string }
            platform: { type: string, example: "Win32" }
            hardware_concurrency: { type: integer, example: 12 }
            device_memory: { type: integer, enum: [ 8, 16, 32 ], example: 16 }
            language: { type: string }
            do_not_track: { type: boolean }
        screen:
          type: object
          additionalProperties: true
          properties:
            width: { type: integer }
            height: { type: integer }
            avail_width: { type: integer }
            avail_height: { type: integer }
            color_depth: { type: integer, example: 24 }
            device_pixel_ratio: { type: number, example: 2 }
            color_gamut: { type: string, enum: [ "", srgb, p3, rec2020 ] }
            refresh_rate:
              type: integer
              minimum: 24
              maximum: 480
              example: 60
              description: >
                How often the claimed display refreshes. Absent means 60. See the refresh_rate field on the create/edit requests.
        client_hints:
          type: object
          description: Сімейство Sec-CH-UA (у browser.vision називається `hints`).
          additionalProperties: true
          properties:
            platform: { type: string }
            platform_version: { type: string }
            architecture: { type: string, example: "x86" }
            bitness: { type: string, example: "64" }
            mobile: { type: boolean }
        webgl:
          type: object
          additionalProperties: true
          properties:
            unmasked_vendor: { type: string }
            unmasked_renderer: { type: string }
        webgpu:
          type: object
          additionalProperties: true
        webrtc:
          type: string
          description: Режим обробки WebRTC.
          enum: [ auto, tcp_only, block ]
        noise:
          $ref: "#/components/schemas/NoisePrefs"
        network:
          type: object
          properties:
            blocked_ports:
              type: array
              items: { type: integer }
              description: Захист від сканування портів локальної мережі (ports_protection).
        timezone:
          type: string
          description: Ім'я за IANA або "auto" — буде визначено через прив'язаний проксі при запуску.

    NoisePrefs:
      type: object
      description: |
        Налаштування антифінгерпринт-шуму за векторами. Кожен блок: `{enabled, seed}`
        (+ специфічні параметри). `enabled:false` = наскрізна передача.
      properties:
        canvas: { $ref: "#/components/schemas/NoiseBlock" }
        webgl:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            intensity: { type: number }
        audio:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            intensity: { type: number }
        client_rects:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            max_offset: { type: number }
        sensors: { $ref: "#/components/schemas/NoiseBlock" }
        fonts:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          description: |
            `enabled:true` приховує невелике детерміноване підмножество
            несуттєвих шрифтів для кожного профілю (решта реальних шрифтів
            хоста проходять наскрізь).

    NoiseBlock:
      type: object
      properties:
        enabled: { type: boolean }
        seed:
          type: integer
          description: Ентропія на профіль; 0 = обчислити автоматично.

    CreateProfileRequest:
      type: object
      required: [ fingerprint ]
      properties:
        name: { type: string }
        notes: { type: string }
        proxy_id:
          type: string
          description: Прив'язати проксі зі сховища (за id).
        proxy:
          type: string
          description: |
            Прив'язати проксі рядком (`host:port:user:pass` або
            `scheme://user:pass@host:port`). Для **постійного** профілю проксі
            додається у сховище (дедуплікація за ендпоінтом) та проходить
            повний тест (UDP + гео), потім прив'язується за id — відображається
            у списку проксі, результат QUIC/WebRTC кешується. Для **тимчасового**
            профілю проксі прикріплюється інлайн (не зберігається). Ігнорується,
            якщо задано `proxy_id`.
          example: "socks5://user:pass@1.2.3.4:1080"
        folder:
          type: string
          description: Тег папки (ігнорується для /folders/{folder}/profiles — там пріоритет у шляху).
        color:
          type: string
          description: |
            Accent for the profile's window icon and for the pill carrying its
            name in the omnibox. Omit it and the icon derives a colour from the
            name while the pill keeps the browser's own toolbar colour.
          example: "#2FCB80"
        extensions:
          type: array
          items: { type: string }
          description: |
            Extension-library ids (`GET /extensions`), loaded at launch. An id
            the library does not hold is a 400 rather than a profile that
            silently starts without it.
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: |
            Claimed display refresh rate, written into `screen.refresh_rate`.
            No web API reports it; a page measures it by timing
            requestAnimationFrame, which is why leaving it out is not neutral —
            absent means 60, what most machines report, rather than whatever
            the host's own screen does. Frames can only be slowed, so the
            effective rate is the closest whole division of the host's panel at
            or under this.
        fingerprint:
          allOf: [ { $ref: "#/components/schemas/Fingerprint" } ]
          description: Зберігається дослівно. Отримайте з /fingerprint/new та за потреби відредагуйте.

    EditProfileRequest:
      type: object
      description: Усі поля необов'язкові — змінюється лише передане.
      properties:
        name: { type: string }
        notes: { type: string }
        folder: { type: string, description: '"" прибирає профіль з папки (переводить до «Усі»).' }
        proxy_id: { type: string, description: '"" від''єднує проксі.' }
        proxy:
          type: string
          description: Рядок проксі — зберігається (дедуплікація) + повний тест, потім прив'язується.
        color:
          type: string
          description: '`#rrggbb`; "" goes back to the name-derived colour.'
        extensions:
          type: array
          items: { type: string }
          description: Replaces the whole list; `[]` loads none.
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: |
            Claimed display refresh rate, applied AFTER `fingerprint` and written into `screen.refresh_rate`.
            No web API reports it; a page measures it by timing
            requestAnimationFrame, which is why leaving it out is not neutral —
            absent means 60, what most machines report, rather than whatever
            the host's own screen does. Frames can only be slowed, so the
            effective rate is the closest whole division of the host's panel at
            or under this.
        fingerprint:
          allOf: [ { $ref: "#/components/schemas/Fingerprint" } ]
          description: При наявності ЗАМІНЮЄ збережений відбиток дослівно.

    TempProfileRequest:
      type: object
      properties:
        fingerprint_id:
          type: string
          description: Запис бібліотеки, на якому ґрунтується профіль; при відсутності — випадковий під `platform`.
        platform:
          type: string
          enum: [ Windows, macOS, Linux ]
          description: Використовується для вибору випадкового відбитка, якщо `fingerprint_id` не вказано; при відсутності обох — ОС хоста.
        proxy:
          type: string
          description: Інлайн-рядок проксі (не зберігається у сховищі).
        name: { type: string }
        folder: { type: string }
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: |
            Claimed display refresh rate, written into `screen.refresh_rate`.
            No web API reports it; a page measures it by timing
            requestAnimationFrame, which is why leaving it out is not neutral —
            absent means 60, what most machines report, rather than whatever
            the host's own screen does. Frames can only be slowed, so the
            effective rate is the closest whole division of the host's panel at
            or under this.
        noise:
          type: object
          description: |
            Per-vector fingerprint noise. Vectors left out keep their default
            (off). Two forms, mixable in one request:

              * shorthand — `{"canvas": true, "webgl": true}`; turning `webgl`
                or `client_rects` on this way also gives it the strength the UI
                uses, since a vector enabled at zero strength does nothing
              * full block — `{"canvas": {"enabled": true, "seed": 42}}`, the
                same shape `GET /profiles/{id}` hands back

            Fields are merged into the vector rather than replacing it, so
            `{"webgl": {"intensity": 0.001}}` leaves `enabled` alone. A `seed`
            of `0` (or omitted) still means "derive a stable one from the
            profile id", which is what keeps two temporary profiles from
            sharing a fingerprint.
          additionalProperties:
            oneOf:
              - type: boolean
              - type: object
                properties:
                  enabled: { type: boolean }
                  seed: { type: integer, format: int64 }
                  intensity: { type: number, description: "`webgl` only." }
                  max_offset: { type: number, description: "`client_rects` only." }
          properties:
            canvas: {}
            webgl: {}
            audio: {}
            client_rects: {}
            sensors: {}
            fonts: {}
          example:
            canvas: true
            webgl: { enabled: true, intensity: 0.0005 }
            fonts: true

    Extension:
      type: object
      properties:
        id: { type: string, description: Pass this in a profile's `extensions`. }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        size_bytes: { type: integer, format: int64 }
        added_at: { type: string, description: "`@<unix_secs>`." }
        icon:
          type: string
          nullable: true
          description: |
            Largest icon the manifest declares, as a `data:` URL. Null on the
            listing endpoint and on extensions that ship none.

    AddExtensionRequest:
      type: object
      description: Exactly one of `url` or `path`.
      properties:
        url:
          type: string
          description: |
            A Chrome Web Store page, a bare 32-character extension id, or a
            direct link to a `.crx` / `.zip`.
          example: https://chromewebstore.google.com/detail/rabby-wallet/acmacodkjbdgmoleebolmdjonilkdbch
        path:
          type: string
          description: A local `.crx`, `.zip` or unpacked folder on the launcher's machine.

    Bookmark:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        url: { type: string }
        folder:
          type: string
          description: Launcher folder; empty means every profile.

    BookmarkRequest:
      type: object
      required: [ url ]
      properties:
        id:
          type: string
          description: Present updates that bookmark; absent creates one.
        url:
          type: string
          description: A bare host is fine — `https://` is added.
          example: facebook.com/ads/manager
        title:
          type: string
          description: Blank uses the address itself.
        folder:
          type: string
          description: Empty (or absent) means every profile.

    TrashEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        folder: { type: string }
        deleted_at: { type: integer, format: int64, description: Unix seconds. }
        expires_at:
          type: integer
          format: int64
          description: Unix seconds; the startup sweep removes anything past it.
        size_bytes:
          type: integer
          format: int64
          description: The archive, which holds the account and not the caches.

    ProfileMeta:
      type: object
      description: Метадані профілю в лаунчері (повертаються при створенні).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: string }
        proxy_id: { type: string, nullable: true }
        last_launched_at: { type: string, nullable: true, description: ISO-8601 або null. }
        created_at: { type: string, nullable: true }
        pinned: { type: boolean }
        folder: { type: string }
        color:
          type: string
          nullable: true
          description: |
            Icon accent as `#rrggbb`; `null` means it is derived from the name,
            which is what the browser does when nothing is chosen.
        extensions:
          type: array
          items: { type: string }
          description: Extension-library ids loaded at launch.

    ProfileListItem:
      allOf:
        - $ref: "#/components/schemas/ProfileMeta"
        - type: object
          properties:
            running: { type: boolean }
            pid: { type: integer, format: int64, nullable: true }
            cdp:
              nullable: true
              allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    StoredProfile:
      type: object
      description: |
        Повний профіль на диску: оболонка `_meta` плюс розгорнутий
        FingerprintConfig (всі поля `Fingerprint` на верхньому рівні).
        `running`/`cdp` присутні лише під час роботи профілю.
      additionalProperties: true
      properties:
        _meta:
          type: object
          properties:
            id: { type: string, format: uuid }
            proxy_id: { type: string, nullable: true }
            inline_proxy:
              nullable: true
              allOf: [ { $ref: "#/components/schemas/ProxyEntry" } ]
            last_launched_at: { type: string, nullable: true }
            created_at: { type: string, nullable: true }
            pinned: { type: boolean }
            folder: { type: string }
            temporary: { type: boolean }
            rev:
              type: integer
              description: >
                Bumped by every write. The desktop editor sends back the number it opened the profile at, so a save that would land on top of a change made through this API is refused rather than silently reverting it. API edits are never refused; they read the profile and write it back in one step.
        running: { type: boolean }
        cdp:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    CdpInfo:
      type: object
      description: CDP-ендпоінт запущеного профілю.
      properties:
        port: { type: integer, description: Порт remote-debugging }
        http_url:
          type: string
          example: "http://127.0.0.1:53217"
          description: REST-база (/json, /json/version).
        web_socket_debugger_url:
          type: string
          example: "ws://127.0.0.1:53217/devtools/browser/ab12-..."
          description: WS-ендпоінт рівня браузера для Puppeteer/Playwright `connect`.

    RunningProfile:
      type: object
      properties:
        profile_id: { type: string }
        pid: { type: integer, format: int64 }
        cdp:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    LibraryEntry:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        platform: { type: string, enum: [ Windows, macOS, Linux ] }
        chrome: { type: string, description: Рядок версії Chrome. }
        gpu: { type: string }
        builtin: { type: boolean, description: Входить у поставляємий стартовий набір. }

    AddProxyRequest:
      type: object
      description: Рядок проксі АБО явні поля (рядок має пріоритет).
      properties:
        proxy:
          type: string
          description: "`scheme://user:pass@host:port` або `host:port:user:pass`."
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        name: { type: string }
        country: { type: string }
        notes: { type: string }

    ProxySummary:
      type: object
      description: Збережений проксі без облікових даних.
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        country: { type: string, description: 'Інформаційний тег (наприклад, "US").' }

    Cookie:
      type: object
      description: |
        Cookie у зручному для інструментів вигляді (сумісний з форматами
        EditThisCookie / Puppeteer — `httpOnly`/`sameSite` приймаються
        як псевдоніми при імпорті).
      required: [ domain, name, value ]
      properties:
        domain:
          type: string
          description: Хост cookie (Chromium `host_key`), наприклад ".example.com".
        name: { type: string }
        value: { type: string }
        path: { type: string, default: "/" }
        expires:
          type: number
          nullable: true
          description: Unix-секунди; null/відсутній = сесійний cookie.
        secure: { type: boolean, default: false }
        http_only: { type: boolean, default: false }
        same_site:
          type: string
          enum: [ Strict, Lax, None, unspecified ]
          description: Регістронезалежно при імпорті.

    ProxyEntry:
      type: object
      description: Повний запис проксі (як вбудовано в `_meta.inline_proxy`).
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        country: { type: string }
        notes: { type: string }

    AutomationBranch:
      description: |
        Where the run goes after a step. A plain string for the simple cases,
        an object for the ones carrying a value.
      oneOf:
        - type: string
          enum: [ next, stop, endpass ]
          description: |
            `next` — the step below. `stop` — end this profile's whole run.
            `endpass` — end this pass; the next one starts from the top.
        - type: object
          properties:
            goto: { type: string, description: "Block id to jump to; one that no longer exists behaves as next." }
        - type: object
          properties:
            retry: { type: integer, description: "Try this same step again, that many more times, then take next." }

    AutomationBlock:
      type: object
      description: One step. `kind` and `params` are open — a module can add a kind this build has never heard of.
      properties:
        id: { type: string }
        kind:
          type: string
          description: |
            A palette kind (`goto`, `click`, `type`, `profile.create`,
            `var.set`, …) or `module:<module id>:<block>`.

            **On a phone profile** the ordinary steps already become touches —
            `click` taps, `rightClick` long-presses, `scroll` and `swipe` use a
            finger — and `hover` is refused, because a phone has no cursor.
            These are the ones with no desktop twin, and they are refused on a
            desktop profile for the same reason:

            | kind | params | what it does |
            | --- | --- | --- |
            | `touch.tap` | `selector` or `x`+`y`, `tapCount` (1–3), `timeout` | A tap, with the contact drifting the way a fingertip does. |
            | `touch.longPress` | `selector` or `x`+`y`, `timeout` | Press and hold — the phone's context menu. |
            | `touch.swipe` | `selector` or `x`+`y`, `dx`, `dy`, `timeout` | A swipe. The browser makes the scroll and the fling out of the touch stream. |
            | `touch.drag` | `selector`, `to`, `holdMs`, `timeout` | Press, wait for the item to be picked up, carry it, set it down. The wait is what makes it a drag and not a scroll. |
            | `touch.pinch` | `scale`, `selector` or `x`+`y` | Two fingers, to zoom. Above 1 spreads. |
            | `screen.rotate` | `angle` (0/90/180/270), `turnMs`, `into` | Turns the handset: the sensors move first, the picture commits at the end. `into` saves the new `screen.orientation.type`. |
          example: click
        label: { type: string }
        params:
          type: object
          additionalProperties: true
          description: The step's own fields, as the palette defines them.
        enabled: { type: boolean, default: true }
        x: { type: number, description: "Canvas position. Layout only — the run follows the branches." }
        y: { type: number }
        on_done: { $ref: "#/components/schemas/AutomationBranch" }
        on_fail:
          allOf:
            - $ref: "#/components/schemas/AutomationBranch"
          description: Defaults to `stop` — carrying on after a click that found nothing is how a run types into the wrong page.
        secrets:
          type: array
          items: { type: string }
          description: Parameter names emptied on export.

    AutomationRunSettings:
      type: object
      properties:
        threads: { type: integer, default: 1, description: "Browsers running at once; clamped to 1–64." }
        loops: { type: integer, default: 1, description: "Passes over the blocks. 0 means run until `hours` is up." }
        hours: { type: number, description: "Only meaningful when `loops` is 0." }
        start: { type: string, description: "Block id to start at; empty means the first." }
        profiles:
          type: array
          items: { type: string }
          description: Kept for projects saved before profiles became blocks; one thread each when set.

    AutomationProject:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/AutomationBlock" }
        run: { $ref: "#/components/schemas/AutomationRunSettings" }
        created_at: { type: integer, description: "Unix seconds." }
        updated_at: { type: integer, description: "Unix seconds." }

    AutomationBundle:
      type: object
      description: A project on its way to another machine.
      properties:
        format: { type: integer, example: 1, description: "An import refuses a number it does not know." }
        exported_at: { type: integer, description: "Unix seconds." }
        project: { $ref: "#/components/schemas/AutomationProject" }
        modules:
          type: array
          items: { type: string }
          description: Module ids the steps need.
        module_files:
          type: array
          description: |
            Those modules' files, carried inside the bundle so an imported
            project can run where it lands. A module missing from disk at
            export time is left out here but still named in `modules`. On
            import, a module already installed under the same id is kept as it
            is rather than overwritten.
          items:
            type: object
            properties:
              id: { type: string }
              wasm: { type: string, description: "The .wasm, gzipped then base64." }
        needs:
          type: array
          description: What export blanked, so an import can ask for exactly that.
          items:
            type: object
            properties:
              block_id: { type: string }
              label: { type: string }
              params:
                type: array
                items: { type: string }

    AutomationWorker:
      type: object
      description: One browser inside a run.
      properties:
        profile_id: { type: string }
        profile_name: { type: string }
        pass: { type: integer, description: "1-based; 0 before the first pass starts." }
        step: { type: integer }
        steps_total: { type: integer }
        status: { type: string, enum: [ queued, starting, running, done, failed, stopped ] }
        note: { type: string }

    AutomationRun:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        started_at: { type: integer, description: "Unix seconds." }
        running: { type: boolean }
        workers:
          type: array
          items: { $ref: "#/components/schemas/AutomationWorker" }
        log:
          type: array
          items: { type: string }
          description: The tail the fleet window shows; the whole log is on disk under `automation-runs/`.

    AutomationModule:
      type: object
      properties:
        id: { type: string, description: "File stem; also the prefix every one of its block kinds carries." }
        name: { type: string }
        path: { type: string }
        blocks:
          type: array
          items: { type: object, additionalProperties: true }
          description: Block descriptors, in the same shape as the built-in palette.
        error: { type: string, description: "Empty when the module loaded; otherwise why it did not." }
