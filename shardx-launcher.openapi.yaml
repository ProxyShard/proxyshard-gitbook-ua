openapi: 3.0.3

info:
  title: "ShardX Browser; Automation API"
  version: "0.1.0"
  description: "Локальний HTTP API для автоматизації антидетект-браузера ShardX:\nгенерація відбитків, створення/запуск/зупинка профілів, отримання\nChrome DevTools Protocol (CDP) WebSocket-ендпоінта для керування\nзапущеним профілем через Puppeteer / Playwright.\n\n## Прив'язка та життєвий цикл\nСервер працює всередині застосунку-лаунчера, слухає лише **127.0.0.1**\nна порту, заданому в *Settings → Automation API* (за замовчуванням **40325**).\nЗ інших хостів він **недоступний**. Зміна порту та включення/відключення\nнабувають чинності після перезапуску застосунку.\n\n## Аутентифікація\nУсі ендпоінти, крім `GET /health`, вимагають **Bearer JWT** (HS256,\nпідписаний секретом лаунчера):\n\n    Authorization: Bearer <token>\n\nПостійний токен відображається в *Settings → Automation API* (скопіюйте\nйого звідти). Кнопка **Regenerate token** миттєво ротує підписуючий\nсекрет: новий токен починає працювати одразу, всі раніше видані токени\nстають недійсними. Окремого API-ключа та ендпоінта для видачі\nтокенів немає; сам токен і є обліковим записом.\n\nВідсутній/невірний токен → `401` з порожнім тілом.\n\n## Типовий сценарій\n1. `GET /fingerprint/new/{platform}` → повністю унікалізований відбиток\n   (випадкова platform_version, CPU/RAM з урахуванням хоста, обрізаний\n   екран, шум по векторах), **не** зберігається.\n2. За бажанням відредагувати повернутий об'єкт `fingerprint` (наприклад,\n   увімкнути `noise.fonts.enabled`, задати `webrtc`, виправити `navigator`).\n3. `POST /profiles` (або `POST /folders/{folder}/profiles`) з цим об'єктом\n   як `fingerprint` → лаунчер зберігає його **як є**\n   (create ніколи не перерандомізує).\n4. `POST /profiles/{id}/start` → повертає CDP-ендпоінт; підключайтеся як\n   `browserWSEndpoint = cdp.web_socket_debugger_url`.\n5. `POST /profiles/{id}/stop` після завершення.\n\n## Проксі та QUIC/WebRTC\nПри **кожному** запуску (через UI або API), до старту браузера, прив'язаний\nпроксі перевіряється живцем на UDP-relay (SOCKS5 UDP_ASSOCIATE). Якщо UDP\nпрацює, вмикається QUIC, а WebRTC може використовувати проксований\nUDP-relay. Якщо ні, QUIC вимикається, WebRTC переводиться в режим\nTCP-only, щоб реальний IP не витік. Поля часового поясу, локалі та\nгеолокації в режимі `auto` також підтягуються живцем через проксі при\nзапуску. Якщо передати `proxy` (рядок) при постійному створенні: проксі додається у сховище та проходить повний тест. Тимчасовий профіль\nзберігає проксі інлайн.\n\n## Тимчасові профілі\n`POST /profiles/temporary` створює профіль із прапорцем `temporary`: він\nприхований з `GET /profiles` та інтерфейсу лаунчера, а після закриття\nбраузера видаляється автоматично (конфіг + папка даних). Якщо застосунок\nвпаде, поки профіль відкритий, він буде видалений при наступному запуску.\n\n## Об'єкт fingerprint\n`fingerprint`, що повертається `GET /fingerprint/new*` та приймається\nендпоінтами створення. Це нативний FingerprintConfig лаунчера. Він\nпередається дослівно, тому схема нижче документує типові\nпідоб'єкти, але навмисно відкрита (`additionalProperties: true`).\n\n## MCP-сервер\nОкремий **MCP** (Model Context Protocol) сервер дозволяє AI-клієнту\nкерувати лаунчером через *цей* API, а браузером профілю через CDP.\nЦе самостійний Node-процес; **не** частина даного HTTP API і\nне хоститься ним. Завантажити можна прямо з лаунчера\n(**Settings → MCP server → Download MCP server** або кнопка «Download MCP»\nна боковій панелі); лаунчер збереже вихідники у вибрану папку.\nТакож доступний у репозиторії: `rust/shardx-launcher/mcp/`.\n\nУсередині він просто викликає цей API: налаштуйте\n`SHARDX_API` (базовий URL) та `SHARDX_TOKEN` (Bearer-токен з\n*Settings → Automation API*). MCP-сервер надає:\n- **API-інструменти**: тонкі обгортки над ендпоінтами нижче\n  (профілі, відбитки, проксі, папки, cookies, запуск/зупинка).\n- **Браузерні інструменти** (patchright поверх CDP). `browser_navigate`,\n  `browser_evaluate`, `browser_screenshot`, `browser_click`,\n  `browser_fill`, вкладки, очікування тощо, застосовуються до профілю,\n  запущеного через `POST /profiles/{id}/start` (який повертає\n  CDP-ендпоінт).\n\nЗапуск: або через **stdio** (клієнт стартує його сам), або через HTTP\nна `127.0.0.1:<port>/mcp` (якщо задано `MCP_HTTP_PORT`). Детальніше див. README MCP-сервера. (Лаунчер лише завантажує його, але не запускає.)\n"
servers:
  - url: http://127.0.0.1:40325
    description: Локальний лаунчер (порт за замовчуванням; змінюється в Settings)

security:
  - bearerAuth: []

tags:
  - name: System
  - name: Fingerprints
  - name: Profiles
  - name: Folders
  - name: Proxies
  - name: Extensions
  - name: Bookmarks
  - name: Trash
  - name: Automation

paths:
  /health:
    get:
      tags: [ System ]
      summary: Перевірка доступності сервера
      description: Повертає базову інформацію про сервер. Єдиний ендпоінт, **не** що вимагає аутентифікації.
      security: []
      responses:
        "200":
          description: Сервер працює.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  name: { type: string, example: shardx-launcher }
                  version: { type: string, example: "0.1.0" }

  /fingerprint/new:
    get:
      tags: [ Fingerprints ]
      summary: Згенерувати новий відбиток (ОС хоста)
      description: |
        Повертає повністю унікалізований відбиток для **хостової**
        операційної системи без збереження. Еквівалентно виклику
        `/fingerprint/new/{platform}` з платформою хоста.
      responses:
        "200":
          description: Унікалізований, не збережений відбиток.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerprintEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Бібліотека відбитків порожня.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /fingerprint/new/{platform}:
    get:
      tags: [ Fingerprints ]
      summary: Згенерувати новий відбиток для заданої платформи
      description: "Вибирає випадковий відбиток з бібліотеки, що відповідає `platform`,\nпотім унікалізує його: нова `platform_version` для Sec-CH-UA,\n`hardware_concurrency`/`device_memory` з урахуванням хоста (не перевищують\nреальні значення машини), екран, обрізаний під реальний дисплей.\nПовертається без збереження; передайте як `fingerprint` в ендпоінт створення.\n"
      parameters:
        - name: platform
          in: path
          required: true
          description: Регістронезалежно; приймаються псевдоніми `win`/`osx`/`darwin`.
          schema:
            type: string
            enum: [ Windows, macOS, Linux ]
      responses:
        "200":
          description: Унікалізований, не збережений відбиток.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerprintEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Підходящий відбиток не знайдено або бібліотека порожня.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles:
    get:
      tags: [ Profiles ]
      summary: Список профілів
      description: "Повертає постійні профілі (тимчасові приховані), від нових до старих,\nзакріплені; вгорі. Кожен запис доповнено актуальним станом запуску.\n"
      responses:
        "200":
          description: Список профілів.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Profiles ]
      summary: Створити профіль
      description: "Зберігає профіль із переданого клієнтом об'єкта `fingerprint` **точно\nяк є** (повторна рандомізація не виконується; унікалізація вже\nвідбулася в `/fingerprint/new`). Використовуйте `folder`, щоб розмістити\nпрофіль у папці; прив'яжіть проксі за `proxy_id` зі сховища або\nінлайн через `proxy` (рядок, **не** зберігається у сховищі проксі).\n"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "200":
          description: Метадані створеного профілю.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "400":
          description: Відсутній або не є об'єктом `fingerprint`, або нерозбірлива строка проксі.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/temporary:
    post:
      tags: [ Profiles ]
      summary: Створити тимчасовий профіль
      description: |
        Створює профіль із випадкового (або вказаного) відбитка бібліотеки,
        унікалізованого як в `/fingerprint/new` і збереженого дослівно,
        з прапорцем `temporary`: прихований зі списків і **автоматично видаляється
        після закриття браузера** (або при наступному запуску після краша).
        Використовуйте разом із `POST /profiles/{id}/start`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TempProfileRequest" }
      responses:
        "200":
          description: Створений тимчасовий профіль.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  fingerprint_id:
                    type: string
                    description: Запис бібліотеки, на основі якого згенеровано профіль.
                  temporary: { type: boolean, example: true }
                  proxy_inline:
                    type: boolean
                    description: Чи був прикріплений інлайн-проксі.
        "400":
          description: Нерозбірливий рядок проксі або невідомий вектор шуму.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Підходящий відбиток не знайдено / порожня бібліотека.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}:
    get:
      tags: [ Profiles ]
      summary: Отримати профіль
      description: "Повертає повний збережений профіль: оболонку `_meta` плюс\nрозгорнутий FingerprintConfig. Якщо профіль запущений; додаються\n`running` та `cdp`.\n"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Збережений профіль.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Профіль не знайдено.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [ Profiles ]
      summary: Видалити профіль
      description: "Переміщує профіль до кошика, де його можна відновити протягом 7 днів. Після цього запис видаляється. До архіву входять облікові дані, cookies, логіни, вебдані, налаштування, Local Storage та IndexedDB, але не кеш. Початкові конфігурація й каталог даних користувача видаляються після створення архіву.\nТимчасові профілі видаляються трекером процесів після закриття браузера і до кошика не потрапляють."
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: "Профіль переміщено в кошик."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string, format: uuid }
                  trashed:
                    type: boolean
                    example: true
                    description: "Можна відновити з кошика протягом 7 днів."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Помилка при видаленні.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [ Profiles ]
      summary: Редагувати профіль
      description: "Оновлює лише передані поля. Якщо передано `fingerprint`; він\nЗАМІНЮЄ збережений дослівно (без перерандомізації).\n`folder: \"\"` прибирає профіль з папки; `proxy_id: \"\"` від'єднує проксі;\nрядок `proxy` зберігається (дедуплікація) + проходить повний тест,\nпотім прив'язується. Повертає оновлений профіль.\n"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditProfileRequest" }
      responses:
        "200":
          description: Оновлений збережений профіль.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredProfile" }
        "400":
          description: Невірний fingerprint (не об'єкт) або нерозбірливий проксі.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Профіль не знайдено.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/start:
    post:
      tags: [ Profiles ]
      summary: Запустити профіль (з CDP)
      description: "Запускає ShardX-браузер для профілю з увімкненим remote-debugging,\nпідставляє часовий пояс/локаль/гео з `auto`-полів через прив'язаний\nпроксі та повертає CDP-ендпоінт після того, як Chrome записав\nDevToolsActivePort. CDP вмикається **лише** при запуску через API\n(запуски з UI не відкривають налагоджувальний порт; антидетект не страждає).\n`cdp` дорівнює `null`, якщо ендпоінт не вдалося прочитати протягом\nтаймауту. Працює для звичайних та тимчасових профілів.\n"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: false
        description: Необов'язково. Порожнє тіло запускає у графічному режимі.
        content:
          application/json:
            schema:
              type: object
              properties:
                headless:
                  type: boolean
                  default: false
                  description: Запустити в headless-режимі (--headless=new).
      responses:
        "200":
          description: Запущено.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string }
                  pid: { type: integer, format: int64, description: PID процесу ОС. }
                  headless: { type: boolean }
                  cdp:
                    nullable: true
                    allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]
                  cdp_error:
                    type: string
                    nullable: true
                    description: "Чому `cdp` має значення null, коли воно є. В іншому випадку відсутні."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Бінарний файл не налаштований / не вдалося запустити процес.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/stop:
    post:
      tags: [ Profiles ]
      summary: Зупинити профіль
      description: |
        Відправляє браузеру сигнал graceful shutdown (SIGTERM на Unix; 5 секунд
        очікування, потім SIGKILL). Тимчасові профілі видаляються в процесі закриття.
        `stopped` дорівнює `false`, якщо профіль не був запущений.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Команда зупинки відправлена.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string }
                  stopped: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/{id}/cookies:
    get:
      tags: [ Profiles ]
      summary: Експортувати cookies
      description: |
        Читає сховище cookies Chromium профілю та повертає всі cookies
        **у розшифрованому вигляді**. Працює як для запущеного, так і для
        зупиненого профілю. Порожній масив, якщо профіль жодного разу не запускався.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: "Печиво."
          content:
            application/json:
              schema:
                type: object
                properties:
                  cookies:
                    type: array
                    items: { $ref: "#/components/schemas/Cookie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Помилка читання або розшифрування БД cookies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [ Profiles ]
      summary: Імпортувати cookies
      description: "Записує cookies у сховище профілю (повторно шифруючи за схемою\nChromium v10). Профіль **повинен бути зупинений**; запущений браузер\nперезапише сховище при виході та затре імпорт.\n"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ cookies ]
              properties:
                cookies:
                  type: array
                  items: { $ref: "#/components/schemas/Cookie" }
      responses:
        "200":
          description: Імпортовано.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer, description: Кількість записаних cookies. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "Профіль запущений; спочатку зупиніть його."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Помилка запису БД cookies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /folders:
    get:
      tags: [ Folders ]
      summary: Список папок
      description: Унікальні непорожні теги папок серед постійних профілів.
      responses:
        "200":
          description: Назви папок.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
                example: [ "work", "scrapers" ]
        "401": { $ref: "#/components/responses/Unauthorized" }

  /folders/{folder}:
    patch:
      tags: [ Folders ]
      summary: Перейменувати папку
      description: Перевішує тег на всіх профілях у папці. Повертає кількість задіяних профілів.
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name ]
              properties:
                name: { type: string, description: Нова назва папки. }
      responses:
        "200":
          description: Перейменовано.
          content:
            application/json:
              schema:
                type: object
                properties:
                  renamed_to: { type: string }
                  profiles: { type: integer, description: Кількість перетегованих профілів. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [ Folders ]
      summary: Видалити папку
      description: |
        Видаляє тег папки. При `delete_profiles=true` профілі всередині теж
        видаляються; інакше вони переходять до «Усі» (тег знімається).
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: delete_profiles
          in: query
          required: false
          description: Видалити профілі з папки (за замовчуванням false = зняти тег).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Видалено.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_folder: { type: string }
                  delete_profiles: { type: boolean }
                  profiles: { type: integer, description: Кількість задіяних профілів. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /folders/{folder}/profiles:
    post:
      tags: [ Folders ]
      summary: Створити профіль у папці
      description: |
        Те саме, що `POST /profiles`, але папка береться з шляху
        (переоприділяє `folder` у тілі запиту).
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "200":
          description: Метадані створеного профілю.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "400":
          description: Відсутній або не є об'єктом `fingerprint`, або нерозбірлива строка проксі.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fingerprints:
    get:
      tags: [ Fingerprints ]
      summary: Список відбитків бібліотеки
      description: Бібліотека відбитків на диску (GPU-пресети), що постачається/імпортується лаунчером.
      responses:
        "200":
          description: Записи бібліотеки.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LibraryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /running:
    get:
      tags: [ Profiles ]
      summary: Список запущених профілів
      description: Профілі з живим процесом браузера, включаючи CDP-ендпоінт при запуску через API.
      responses:
        "200":
          description: Запущені профілі.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunningProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /proxies:
    get:
      tags: [ Proxies ]
      summary: Список збережених проксі
      description: Проксі, збережені у сховищі лаунчера. **Облікові дані (логін/пароль) не повертаються.**
      responses:
        "200":
          description: Коротка інформація про проксі.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProxySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Proxies ]
      summary: Додати проксі
      description: |
        Додає проксі у сховище (з дедуплікацією за ендпоінтом). Передайте
        рядок `proxy` або явні поля `host`/`port` (+ `kind`/`username`/`password`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProxyRequest" }
      responses:
        "200":
          description: Коротка інформація про збережений проксі.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxySummary" }
        "400":
          description: Нерозбірливий проксі / не вказані host та port.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /proxies/{id}:
    delete:
      tags: [ Proxies ]
      summary: Видалити проксі
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Видалено.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /extensions:
    get:
      tags: [ Extensions ]
      summary: "Розширення списку"
      description: "Повертає розширення, доступні для профілів. Використовуйте розширення `id` у полі `extensions` `POST /profiles` або `PATCH /profiles/{id}`. Значки пропущено, оскільки URL-адреси даних можуть бути великими. `POST /extensions` містить значок доданого розширення."
      responses:
        "200":
          description: "Список розширень."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Extension" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Extensions ]
      summary: "Додайте розширення"
      description: "Укажіть або `url`, або `path`.\n\n`url` може містити сторінку Chrome Web Store, 32-символьний ідентифікатор розширення або пряме посилання на `.crx` чи `.zip`. Лаунчер самостійно знаходить і завантажує файл зі сторінки магазину. `path` має вказувати на локальний `.crx`, `.zip` або розпаковану папку на машині, де працює лаунчер.\n\nНазва, версія, опис і значок беруться з `manifest.json` розширення. Плейсхолдери `__MSG_*__` також обробляються відповідно до локалі за замовчуванням."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddExtensionRequest" }
      responses:
        "200":
          description: "Розширення додано. Відповідь містить `icon`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extension" }
        "400":
          description: "Ні `url`, ні `path` не вказано, посилання не є розширенням або магазин не має такого ідентифікатора."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /extensions/{id}:
    delete:
      tags: [ Extensions ]
      summary: "Видаліть розширення"
      description: "Профілі містять ідентифікатори, а не копії, тому будь-який профіль із назвою цього розширення припиняє завантажувати його після наступного запуску. Їхній збережений список залишається таким, яким він є; повторне додавання розширення не відновлює прив’язку."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Видалено."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookmarks:
    get:
      tags: [ Bookmarks ]
      summary: "Список закладок"
      responses:
        "200":
          description: "Кожна закладка в папках."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bookmark" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Bookmarks ]
      summary: "Створіть або оновіть закладку"
      description: "Якщо вказано `id`, закладка оновлюється, інакше створюється.\n\nЗакладка, прив’язана до папки, відображається на панелі закладок кожного профілю в цій папці, у папці **ShardX**. `folder: \"\"` означає всі профілі. Керується лише ця папка, тому закладки, які оператор зберіг у профілі, не змінюються.\n\nЗміни застосовуються під час наступного запуску профілю. Файл записується безпосередньо перед читанням браузером, тому запущений профіль їх не бачить."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkRequest" }
      responses:
        "200":
          description: "Збережена закладка."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "400":
          description: "Потрібно ввести `url`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookmarks/{id}:
    delete:
      tags: [ Bookmarks ]
      summary: "Видалити закладку"
      description: "Він залишає свої профілі під час наступного запуску."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Видалено."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trash:
    get:
      tags: [ Trash ]
      summary: "Список видалених профілів"
      description: "Повертає профілі, заархівовані `DELETE /profiles/{id}`, спочатку найновіші, із часом їх відновлення. Прострочені записи видаляються під час запуску програми запуску."
      responses:
        "200":
          description: "Вміст «Кошика»."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrashEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trash/{id}/restore:
    post:
      tags: [ Trash ]
      summary: "Відновити видалений профіль"
      description: "Відновлює профіль під його **власним ідентифікатором**, тому скрипт, папка закладок або прив’язка проксі, що посилаються на нього, продовжать працювати. Архів видаляється після відновлення.\n\nВідновлюються облікові дані, cookies, логіни, вебдані, налаштування, історія, закладки, Local Storage та IndexedDB. Кеш не архівується і створюється знову під час наступного запуску."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Відновлений профіль."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Немає видалених профілів із цим ідентифікатором."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /trash/{id}:
    delete:
      tags: [ Trash ]
      summary: "Назавжди видалити викинутий профіль"
      description: "Цю дію не можна скасувати: архів є єдиною копією, що залишилася."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Очищений."
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged: { type: boolean, example: true }
                  id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects:
    get:
      tags: [ Automation ]
      summary: "Список проектів автоматизації"
      description: "Кожен проект, збережений у панелі запуску, з його блоками та налаштуваннями запуску. Це ті самі проекти, які редагує розділ **Automation**."
      responses:
        "200":
          description: "Список проектів."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Automation ]
      summary: "Створити проект"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: "Використовує `Untitled`, коли порожній." }
      responses:
        "200":
          description: "Створений проект."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects/{id}:
    get:
      tags: [ Automation ]
      summary: "Отримати проект"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Деталі проекту."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Проект не знайдено."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [ Automation ]
      summary: "Замінити проект"
      description: "Повністю замінює проєкт. Надішліть об’єкт у форматі відповіді `GET`. Ідентифікатор у шляху має пріоритет над ідентифікатором у тілі запиту. Якщо проєкт не існує, повертається `404`; для створення використовуйте `POST /automation/projects`."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationProject" }
      responses:
        "200":
          description: "Збережений проект."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "400":
          description: "Недійсний об'єкт проекту."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Проект не знайдено."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [ Automation ]
      summary: "Видалити проект"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Видалено."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Проект не знайдено."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/duplicate:
    post:
      tags: [ Automation ]
      summary: "Дубльований проект"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Дубльований проект."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Проект не знайдено."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/export:
    get:
      tags: [ Automation ]
      summary: "Експорт пакета проектів"
      description: "Параметри проекту, позначені секретними, спорожняються на виході, тому пакет можна передати, не беручи з собою пароль. Сторона імпорту просить їх знову."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Експортний комплект."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationBundle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Проект не знайдено."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/import:
    post:
      tags: [ Automation ]
      summary: "Імпорт пакета проектів"
      description: "Пакет надходить як новий проект із новим ідентифікатором."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationBundle" }
      responses:
        "200":
          description: "Імпортований проект."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "400":
          description: "Недійсний пакет або непідтримувана версія формату."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects/{id}/run:
    post:
      tags: [ Automation ]
      summary: "Розпочати проект"
      description: "Запускає проєкт і одразу повертає відповідь. Потрібні браузери запускаються блоками самого проєкту. Використовуйте `/status` для відстеження прогресу.\n\nЯкщо проєкт уже запущено або в ньому немає активних кроків, повертається `400`."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Проект розпочато."
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: { type: string, format: uuid }
                  running: { type: boolean, example: true }
        "400":
          description: "Проект уже запущено або не має ввімкнених кроків."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Проект не знайдено."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: "Ця збірка не підтримує автоматизацію."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/stop:
    post:
      tags: [ Automation ]
      summary: "Зупинити проект"
      description: "Запитує зупинку запуску. Кожен браузер завершує поточний крок і закривається, тому запуск не зникає одразу після відповіді. Стежте за полем `running` через `/status`."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Запит на зупинку прийнято."
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: { type: string, format: uuid }
                  stopping: { type: boolean, example: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "Ця збірка не підтримує автоматизацію."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/status:
    get:
      tags: [ Automation ]
      summary: "Отримати статус виконання проекту"
      description: "Повертає `null`, якщо проєкт ще не запускався після запуску лаунчера. `log` містить останні записи, показані у вікні запусків. Повний журнал зберігається в `automation-runs/`."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Статус виконання або `null`."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AutomationRun"
                  - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "Ця збірка не підтримує автоматизацію."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/runs:
    get:
      tags: [ Automation ]
      summary: "Список активних прогонів"
      responses:
        "200":
          description: "Список активних запусків."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "Ця збірка не підтримує автоматизацію."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/modules:
    get:
      tags: [ Automation ]
      summary: "Список встановлених модулів"
      description: "Повертає встановлені оператором модулі WebAssembly. Кожен модуль додає блоки з типом `module:<module id>:<block>`. Модулі повертають дії для виконавця і не звертаються до сторінки напряму."
      responses:
        "200":
          description: "Список модулів."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationModule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "Ця збірка не підтримує автоматизацію."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [ Automation ]
      summary: "Встановити модуль"
      description: "`path` має вказувати на локальний файл `.wasm` на машині, де запущено лаунчер. Модуль містить нативний код, зібраний оператором."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ path ]
              properties:
                path: { type: string, example: "/home/me/module.wasm" }
      responses:
        "200":
          description: "Встановлений модуль."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationModule" }
        "400":
          description: "Відсутній шлях або файл модуля не підтримується."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "Ця збірка не підтримує автоматизацію."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/modules/{id}:
    delete:
      tags: [ Automation ]
      summary: "Зняти модуль"
      description: "Проекти, які використовують модуль, перестають працювати. Існуючі визначення проекту не змінено."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Видалено."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Модуль не знайдено."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: "Ця збірка не підтримує автоматизацію."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Постійний JWT з Settings → Automation API.

  parameters:
    ProfileId:
      name: id
      in: path
      required: true
      description: UUID профілю.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Відсутній або недійсний Bearer-токен.

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [ error ]

    FingerprintEnvelope:
      type: object
      properties:
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
      required: [ fingerprint ]

    Fingerprint:
      type: object
      description: "Нативний FingerprintConfig. Задокументовані підоб'єкти; найпоширеніші;\nоб'єкт відкритий і зберігається ендпоінтами створення\nдослівно, тому будь-яке поле тут буде передано без змін.\n"
      additionalProperties: true
      properties:
        name: { type: string }
        notes: { type: string }
        seed:
          type: integer
          description: 0 = режим лише перевизначень (типовий випадок).
        navigator:
          type: object
          additionalProperties: true
          properties:
            user_agent: { type: string }
            platform: { type: string, example: "Win32" }
            hardware_concurrency: { type: integer, example: 12 }
            device_memory: { type: integer, enum: [ 8, 16, 32 ], example: 16 }
            language: { type: string }
            do_not_track: { type: boolean }
        screen:
          type: object
          additionalProperties: true
          properties:
            width: { type: integer }
            height: { type: integer }
            avail_width: { type: integer }
            avail_height: { type: integer }
            color_depth: { type: integer, example: 24 }
            device_pixel_ratio: { type: number, example: 2 }
            color_gamut: { type: string, enum: [ "", srgb, p3, rec2020 ] }
            refresh_rate:
              type: integer
              minimum: 24
              maximum: 480
              example: 60
              description: "Заявлена частота оновлення екрана. Якщо поле не вказано, використовується 60. Див. поле `refresh_rate` у запитах створення та редагування."
        client_hints:
          type: object
          description: Сімейство Sec-CH-UA (у browser.vision називається `hints`).
          additionalProperties: true
          properties:
            platform: { type: string }
            platform_version: { type: string }
            architecture: { type: string, example: "x86" }
            bitness: { type: string, example: "64" }
            mobile: { type: boolean }
        webgl:
          type: object
          additionalProperties: true
          properties:
            unmasked_vendor: { type: string }
            unmasked_renderer: { type: string }
        webgpu:
          type: object
          additionalProperties: true
        webrtc:
          type: string
          description: Режим обробки WebRTC.
          enum: [ auto, tcp_only, block ]
        noise:
          $ref: "#/components/schemas/NoisePrefs"
        network:
          type: object
          properties:
            blocked_ports:
              type: array
              items: { type: integer }
              description: Захист від сканування портів локальної мережі (ports_protection).
        timezone:
          type: string
          description: "Ім'я за IANA або \"auto\"; буде визначено через прив'язаний проксі при запуску."

    NoisePrefs:
      type: object
      description: |
        Налаштування антифінгерпринт-шуму за векторами. Кожен блок: `{enabled, seed}`
        (+ специфічні параметри). `enabled:false` = наскрізна передача.
      properties:
        canvas: { $ref: "#/components/schemas/NoiseBlock" }
        webgl:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            intensity: { type: number }
        audio:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            intensity: { type: number }
        client_rects:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            max_offset: { type: number }
        sensors: { $ref: "#/components/schemas/NoiseBlock" }
        fonts:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          description: |
            `enabled:true` приховує невелике детерміноване підмножество
            несуттєвих шрифтів для кожного профілю (решта реальних шрифтів
            хоста проходять наскрізь).

    NoiseBlock:
      type: object
      properties:
        enabled: { type: boolean }
        seed:
          type: integer
          description: Ентропія на профіль; 0 = обчислити автоматично.

    CreateProfileRequest:
      type: object
      required: [ fingerprint ]
      properties:
        name: { type: string }
        notes: { type: string }
        proxy_id:
          type: string
          description: Прив'язати проксі зі сховища (за id).
        proxy:
          type: string
          description: "Прив'язати проксі рядком (`host:port:user:pass` або\n`scheme://user:pass@host:port`). Для **постійного** профілю проксі\nдодається у сховище (дедуплікація за ендпоінтом) та проходить\nповний тест (UDP + гео), потім прив'язується за id; відображається\nу списку проксі, результат QUIC/WebRTC кешується. Для **тимчасового**\nпрофілю проксі прикріплюється інлайн (не зберігається). Ігнорується,\nякщо задано `proxy_id`.\n"
          example: "socks5://user:pass@1.2.3.4:1080"
        folder:
          type: string
          description: "Тег папки (ігнорується для /folders/{folder}/profiles; там пріоритет у шляху)."
        color:
          type: string
          description: "Акцентний колір піктограми вікна профілю та мітки з його назвою в адресному рядку. Якщо поле не вказано, колір піктограми визначається за назвою, а мітка зберігає колір панелі інструментів браузера."
          example: "#2FCB80"
        extensions:
          type: array
          items: { type: string }
          description: "Ідентифікатори бібліотеки розширень (`GET /extensions`), завантажуються під час запуску. Бібліотека не має ідентифікатора 400, а не профілю, який автоматично запускається без нього."
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: "Заявлена частота оновлення екрана, записана в `screen.refresh_rate`. Жоден веб-API не повідомляє це значення; сторінка оцінює його за часом виконання requestAnimationFrame. Якщо поле не вказано, використовується 60, а не частота екрана хоста. Кадри можна лише сповільнювати, тому фактична частота є найближчим цілим дільником частоти панелі хоста, що не перевищує вказане значення."
        fingerprint:
          allOf: [ { $ref: "#/components/schemas/Fingerprint" } ]
          description: Зберігається дослівно. Отримайте з /fingerprint/new та за потреби відредагуйте.

    EditProfileRequest:
      type: object
      description: "Усі поля необов'язкові; змінюється лише передане."
      properties:
        name: { type: string }
        notes: { type: string }
        folder: { type: string, description: '"" прибирає профіль з папки (переводить до «Усі»).' }
        proxy_id: { type: string, description: '"" від''єднує проксі.' }
        proxy:
          type: string
          description: "Рядок проксі; зберігається (дедуплікація) + повний тест, потім прив'язується."
        color:
          type: string
          description: "`#rrggbb`; \"\" повертається до кольору, похідного від назви."
        extensions:
          type: array
          items: { type: string }
          description: "Замінює весь список; `[]` не завантажує нічого."
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: "Заявлена частота оновлення екрана, застосована ПІСЛЯ `fingerprint` і записана в `screen.refresh_rate`. Жоден веб-API не повідомляє це значення; сторінка оцінює його за часом виконання requestAnimationFrame. Якщо поле не вказано, використовується 60, а не частота екрана хоста. Кадри можна лише сповільнювати, тому фактична частота є найближчим цілим дільником частоти панелі хоста, що не перевищує вказане значення."
        fingerprint:
          allOf: [ { $ref: "#/components/schemas/Fingerprint" } ]
          description: При наявності ЗАМІНЮЄ збережений відбиток дослівно.

    TempProfileRequest:
      type: object
      properties:
        fingerprint_id:
          type: string
          description: "Запис бібліотеки, на основі якого створюється профіль; якщо не вказано, обирається випадковий запис для `platform`."
        platform:
          type: string
          enum: [ Windows, macOS, Linux ]
          description: "Використовується для вибору випадкового відбитка, якщо не вказано `fingerprint_id`; якщо не вказано жодного з них, береться ОС хоста."
        proxy:
          type: string
          description: Інлайн-рядок проксі (не зберігається у сховищі).
        name: { type: string }
        folder: { type: string }
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: "Заявлена частота оновлення екрана, записана в `screen.refresh_rate`. Жоден веб-API не повідомляє це значення; сторінка оцінює його за часом виконання requestAnimationFrame. Якщо поле не вказано, використовується 60, а не частота екрана хоста. Кадри можна лише сповільнювати, тому фактична частота є найближчим цілим дільником частоти панелі хоста, що не перевищує вказане значення."
        noise:
          type: object
          description: "Шум відбитка для кожного вектора. Вектори, яких немає в запиті, зберігають значення за замовчуванням (вимкнені).\n\nМожна поєднати два формати в одному запиті:\n\n  * скорочений: `{\"canvas\": true, \"webgl\": true}`; для `webgl` і `client_rects` також застосовується інтенсивність, яку використовує інтерфейс;\n  * повний об’єкт: `{\"canvas\": {\"enabled\": true, \"seed\": 42}}`, у форматі відповіді `GET /profiles/{id}`.\n\nПоля об’єднуються з налаштуваннями вектора, а не замінюють їх. Наприклад, `{\"webgl\": {\"intensity\": 0.001}}` не змінює `enabled`. Якщо `seed` дорівнює 0 або не вказаний, стабільне значення виводиться з ідентифікатора профілю, щоб два тимчасові профілі не отримали однаковий відбиток."
          additionalProperties:
            oneOf:
              - type: boolean
              - type: object
                properties:
                  enabled: { type: boolean }
                  seed: { type: integer, format: int64 }
                  intensity: { type: number, description: "Лише `webgl`." }
                  max_offset: { type: number, description: "Лише `client_rects`." }
          properties:
            canvas: {}
            webgl: {}
            audio: {}
            client_rects: {}
            sensors: {}
            fonts: {}
          example:
            canvas: true
            webgl: { enabled: true, intensity: 0.0005 }
            fonts: true

    Extension:
      type: object
      properties:
        id: { type: string, description: "Передайте це в `extensions` профілю." }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        size_bytes: { type: integer, format: int64 }
        added_at: { type: string, description: "`@<unix_secs>`." }
        icon:
          type: string
          nullable: true
          description: "Найбільша піктограма, яку декларує маніфест, як URL-адреса `data:`. Null на кінцевій точці списку та на розширеннях, які не надсилають жодних."
    AddExtensionRequest:
      type: object
      description: "Точно один із `url` або `path`."
      properties:
        url:
          type: string
          description: "Сторінка Веб-магазину Chrome, простий ідентифікатор розширення з 32 символів або пряме посилання на `.crx` / `.zip`."
          example: https://chromewebstore.google.com/detail/rabby-wallet/acmacodkjbdgmoleebolmdjonilkdbch
        path:
          type: string
          description: "Локальна папка `.crx`, `.zip` або розпакована папка на машині програми запуску."

    Bookmark:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        url: { type: string }
        folder:
          type: string
          description: "папка Launcher; порожній означає кожен профіль."

    BookmarkRequest:
      type: object
      required: [ url ]
      properties:
        id:
          type: string
          description: "Якщо вказано, оновлює цю закладку; якщо не вказано, створює нову."
        url:
          type: string
          description: "Достатньо вказати хост без схеми, до нього додається `https://`."
          example: facebook.com/ads/manager
        title:
          type: string
          description: "Бланк використовує саму адресу."
        folder:
          type: string
          description: "Порожній (або відсутній) означає кожен профіль."

    TrashEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        folder: { type: string }
        deleted_at: { type: integer, format: int64, description: "Unix секунд." }
        expires_at:
          type: integer
          format: int64
          description: "Unix секунди; розгортка запуску видаляє все, що минуло."
        size_bytes:
          type: integer
          format: int64
          description: "Архів, у якому зберігається обліковий запис, а не кеш."

    ProfileMeta:
      type: object
      description: Метадані профілю в лаунчері (повертаються при створенні).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: string }
        proxy_id: { type: string, nullable: true }
        last_launched_at: { type: string, nullable: true, description: ISO-8601 або null. }
        created_at: { type: string, nullable: true }
        pinned: { type: boolean }
        folder: { type: string }
        color:
          type: string
          nullable: true
          description: "Акцентний колір значка у форматі `#rrggbb`; `null` означає, що колір визначається за назвою, як у браузері, коли колір не вибрано."
        extensions:
          type: array
          items: { type: string }
          description: "Ідентифікатори бібліотеки розширень завантажуються під час запуску."

    ProfileListItem:
      allOf:
        - $ref: "#/components/schemas/ProfileMeta"
        - type: object
          properties:
            running: { type: boolean }
            pid: { type: integer, format: int64, nullable: true }
            cdp:
              nullable: true
              allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    StoredProfile:
      type: object
      description: |
        Повний профіль на диску: оболонка `_meta` плюс розгорнутий
        FingerprintConfig (всі поля `Fingerprint` на верхньому рівні).
        `running`/`cdp` присутні лише під час роботи профілю.
      additionalProperties: true
      properties:
        _meta:
          type: object
          properties:
            id: { type: string, format: uuid }
            proxy_id: { type: string, nullable: true }
            inline_proxy:
              nullable: true
              allOf: [ { $ref: "#/components/schemas/ProxyEntry" } ]
            last_launched_at: { type: string, nullable: true }
            created_at: { type: string, nullable: true }
            pinned: { type: boolean }
            folder: { type: string }
            temporary: { type: boolean }
            rev:
              type: integer
              description: "Кожен запис збільшує номер версії. Редактор робочого столу передає номер версії, на якому було відкрито профіль, тому збереження поверх зміни, внесеної через цей API, відхиляється, а не скасовується автоматично. Зміни через API не відхиляються: профіль читається і записується назад за один крок."
        running: { type: boolean }
        cdp:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    CdpInfo:
      type: object
      description: CDP-ендпоінт запущеного профілю.
      properties:
        port: { type: integer, description: Порт remote-debugging }
        http_url:
          type: string
          example: "http://127.0.0.1:53217"
          description: REST-база (/json, /json/version).
        web_socket_debugger_url:
          type: string
          example: "ws://127.0.0.1:53217/devtools/browser/ab12-..."
          description: WS-ендпоінт рівня браузера для Puppeteer/Playwright `connect`.

    RunningProfile:
      type: object
      properties:
        profile_id: { type: string }
        pid: { type: integer, format: int64 }
        cdp:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    LibraryEntry:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        platform: { type: string, enum: [ Windows, macOS, Linux ] }
        chrome: { type: string, description: Рядок версії Chrome. }
        gpu: { type: string }
        builtin: { type: boolean, description: Входить у поставляємий стартовий набір. }

    AddProxyRequest:
      type: object
      description: Рядок проксі АБО явні поля (рядок має пріоритет).
      properties:
        proxy:
          type: string
          description: "`scheme://user:pass@host:port` або `host:port:user:pass`."
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        name: { type: string }
        country: { type: string }
        notes: { type: string }

    ProxySummary:
      type: object
      description: Збережений проксі без облікових даних.
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        country: { type: string, description: 'Інформаційний тег (наприклад, "US").' }

    Cookie:
      type: object
      description: "Cookie у зручному для інструментів вигляді (сумісний з форматами\nEditThisCookie / Puppeteer; `httpOnly`/`sameSite` приймаються\nяк псевдоніми при імпорті).\n"
      required: [ domain, name, value ]
      properties:
        domain:
          type: string
          description: Хост cookie (Chromium `host_key`), наприклад ".example.com".
        name: { type: string }
        value: { type: string }
        path: { type: string, default: "/" }
        expires:
          type: number
          nullable: true
          description: Unix-секунди; null/відсутній = сесійний cookie.
        secure: { type: boolean, default: false }
        http_only: { type: boolean, default: false }
        same_site:
          type: string
          enum: [ Strict, Lax, None, unspecified ]
          description: Регістронезалежно при імпорті.

    ProxyEntry:
      type: object
      description: Повний запис проксі (як вбудовано в `_meta.inline_proxy`).
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        country: { type: string }
        notes: { type: string }

    AutomationBranch:
      description: "Напрямок після виконання кроку. Для простих випадків використовується рядок, для значень з параметрами - об’єкт."
      oneOf:
        - type: string
          enum: [ next, stop, endpass ]
          description: "`next`: перейти до наступного кроку. `stop`: завершити весь запуск профілю. `endpass`: завершити поточний прохід і почати наступний з першого кроку."
        - type: object
          properties:
            goto: { type: string, description: "Ідентифікатор блока для переходу. Якщо блока більше немає, використовується `next`." }
        - type: object
          properties:
            retry: { type: integer, description: "Спробуйте цей самий крок ще раз, стільки разів, а потім виконайте наступний." }

    AutomationBlock:
      type: object
      description: "Один крок автоматизації. `kind` і `params` розширюються, тому модуль може додавати нові типи кроків."
      properties:
        id: { type: string }
        kind:
          type: string
          description: "Тип вбудованої палітри (`goto`, `click`, `type`, `profile.create`, `var.set`, ...) або `module:<module id>:<block>`.\n\n**У мобільному профілі** звичайні кроки вже перетворюються на дотики: `click` виконує дотик, `rightClick` - довге натискання, `scroll` і `swipe` - жести. `hover` недоступний, оскільки на телефоні немає вказівника. Наведені нижче кроки доступні лише на мобільних профілях і відхиляються на настільних:\n\n| Тип | Параметри | Дія | | --- | --- | --- | | `touch.tap` | `selector` або `x`+`y`, `tapCount` (1-3), `timeout` | Дотик до цілі. | | `touch.longPress` | `selector` або `x`+`y`, `timeout` | Натиснути й утримувати. | | `touch.swipe` | `selector` або `x`+`y`, `dx`, `dy`, `timeout` | Провести пальцем. | | `touch.drag` | `selector`, `to`, `holdMs`, `timeout` | Перетягнути елемент. | | `touch.pinch` | `scale`, `selector` або `x`+`y` | Змінити масштаб двома пальцями. Значення понад 1 зменшує масштаб. | | `screen.rotate` | `angle` (0/90/180/270), `turnMs`, `into` | Повернути пристрій. `into` зберігає новий `screen.orientation.type`. |"
          example: click
        label: { type: string }
        params:
          type: object
          additionalProperties: true
          description: "Власні поля кроку, як їх визначає палітра."
        enabled: { type: boolean, default: true }
        x: { type: number, description: "Положення на полотні. Лише для макета, порядок виконання визначають гілки." }
        y: { type: number }
        on_done: { $ref: "#/components/schemas/AutomationBranch" }
        on_fail:
          allOf:
            - $ref: "#/components/schemas/AutomationBranch"
          description: "За замовчуванням `stop`; продовження після клацання, яке нічого не знайшло, - це те, як запуск друкує на неправильній сторінці."
        secrets:
          type: array
          items: { type: string }
          description: "Назви параметрів порожні під час експорту."

    AutomationRunSettings:
      type: object
      properties:
        threads: { type: integer, default: 1, description: "Одночасний запуск браузерів; закріплений на 1-64." }
        loops: { type: integer, default: 1, description: "Проходить через блоки. 0 означає виконання, доки `hours` не підніметься." }
        hours: { type: number, description: "Має значення лише тоді, коли `loops` дорівнює 0." }
        start: { type: string, description: "Ідентифікатор блоку для початку; порожній означає перший." }
        profiles:
          type: array
          items: { type: string }
          description: "Зберігається для проектів, збережених до того, як профілі стали блоками; одна нитка кожна, коли встановлено."

    AutomationProject:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/AutomationBlock" }
        run: { $ref: "#/components/schemas/AutomationRunSettings" }
        created_at: { type: integer, description: "Unix секунд." }
        updated_at: { type: integer, description: "Unix секунд." }

    AutomationBundle:
      type: object
      description: "Проект на шляху до іншої машини."
      properties:
        format: { type: integer, example: 1, description: "Імпорт відхиляє невідомий йому номер." }
        exported_at: { type: integer, description: "Unix секунд." }
        project: { $ref: "#/components/schemas/AutomationProject" }
        modules:
          type: array
          items: { type: string }
          description: "Ідентифікатори модулів, необхідні кроки."
        module_files:
          type: array
          description: "Файли цих модулів містяться в пакеті, щоб імпортований проект міг працювати там, де він потрапляє. Модуль, відсутній на диску під час експорту, тут не враховується, але має назву `modules`. Під час імпорту модуль, який уже встановлено під тим самим ідентифікатором, зберігається, а не перезаписується."
          items:
            type: object
            properties:
              id: { type: string }
              wasm: { type: string, description: ".wasm, gzip, а потім base64." }
        needs:
          type: array
          description: "Поля, очищені під час експорту, які потрібно запросити під час імпорту."
          items:
            type: object
            properties:
              block_id: { type: string }
              label: { type: string }
              params:
                type: array
                items: { type: string }

    AutomationWorker:
      type: object
      description: "Один браузер у серії."
      properties:
        profile_id: { type: string }
        profile_name: { type: string }
        pass: { type: integer, description: "1-основний; 0 перед початком першого проходу." }
        step: { type: integer }
        steps_total: { type: integer }
        status: { type: string, enum: [ queued, starting, running, done, failed, stopped ] }
        note: { type: string }

    AutomationRun:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        started_at: { type: integer, description: "Unix секунд." }
        running: { type: boolean }
        workers:
          type: array
          items: { $ref: "#/components/schemas/AutomationWorker" }
        log:
          type: array
          items: { type: string }
          description: "Останні записи, показані у вікні запусків. Повний журнал зберігається в `automation-runs/`."

    AutomationModule:
      type: object
      properties:
        id: { type: string, description: "стебло файлу; також префікс, який має кожен із його типів блоків." }
        name: { type: string }
        path: { type: string }
        blocks:
          type: array
          items: { type: object, additionalProperties: true }
          description: "Дескриптори блоків у тій самій формі, що й вбудована палітра."
        error: { type: string, description: "Порожній під час завантаження модуля; інакше чому не сталося." }
