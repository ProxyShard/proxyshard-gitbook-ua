        - Residential Proxies
      summary: "Список провайдерів"
      description: "наявність інтернет-провайдерів у місті; четвертий рівень націлювання після країни, регіону та міста. На відміну від інших кінцевих точок розташування, для цього потрібен повний ланцюжок: потрібні `country_code`, `region_code` ТА `city_code`, оскільки перші провайдери прив’язані до міста. Лише преміальний пакет: каталог провайдерів не підтримується для стандартних і необмежених пакетів, а будь-які інші `proxy_type` відхиляються з 400. Інтернет-провайдери наведено лише для великих міст, тому порожній `results` із `count: 0` є нормальною відповіддю для меншого міста."
      parameters:
        - in: query
          name: proxy_type
          required: true
          description: "Має бути `premium`; Орієнтація на провайдера лише преміум-класу"
          schema:
            type: string
            enum:
              - premium
        - in: query
          name: country_code
          required: true
          description: "ISO код країни"
          schema:
            type: string
        - in: query
          name: region_code
          required: true
          description: "Код регіону або штату"
          schema:
            type: string
        - in: query
          name: city_code
          required: true
          description: "Код міста з GET /user/api/proxies/cities"
          schema:
            type: string
      responses:
        '200':
          description: "Успіх"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedIspsResponse'
        '400':
          description: "proxy_type не `premium`, резидент користувача не встановлено, або користувач не має активного замовлення на пакет"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                notPremium:
                  value:
                    success: false
                    message: ISP targeting is available for the premium package only
        '401':
          description: "Потрібна авторизація"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
