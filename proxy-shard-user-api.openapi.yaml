# ============================================================================
# ShardX User API: OpenAPI 3.0.3.
#
# ИСТОЧНИК ПРАВДЫ по публичному API. Раньше спека жила только в GitBook
# (docs.shardx.com/proxyshard-api/*), из-за чего расходилась с кодом
# незаметно: ответы ручек уже отдавали message и proxy_password, а спека
# продолжала обещать старую форму.
#
# Правила:
#   * добавил/изменил ручку в services/user-api - правь этот файл в ТОМ ЖЕ
#     коммите;
#   * теги = страницы в GitBook, менять их имена без нужды не стоит;
#   * после мержа залить файл в GitBook (OpenAPI-спека проекта), иначе
#     клиенты снова увидят устаревшее.
#
# Проверка перед заливкой:
#   python -m openapi_spec_validator services/user-api/openapi.yaml
# ============================================================================
openapi: 3.0.3
info:
  title: "Платіж за API користувача ShardX"
  version: 1.3.1
servers:
  - url: https://user-api.shardx.com
security:
  - bearerAuth: []
tags:
  - name: General
    description: Загальні операції (профіль, замовлення, довідники)
  - name: Datacenter & ISP Proxies
    description: Операції для датацентрових та ISP проксі
  - name: Residential Proxies
    description: Операції для резидентських проксі
  - name: Service
    description: "Зонди здоров'я (без автентифікації)"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: |
        Необов'язковий. Унікальний ідентифікатор логічної операції (1–128 символів із `[A-Za-z0-9_.:-]`), наприклад UUID.
        Повторюючи запит, результат якого невідомий (тайм-аут, обрив з'єднання), надсилайте ТОЙ САМИЙ ключ: уже виконаний запит НЕ виконується повторно, повертається його початкова відповідь.

        Приймається на ВСІХ методах, що змінюють дані (`POST`/`PUT`/`PATCH`/`DELETE`): купівля, продовження, докупівля трафіку, додаткові компоненти та будь-які методи, додані пізніше; явно вказаний на методах, що списують кошти.

        * Усі методи, крім операцій із саб-користувачами: збережена відповідь повертається повторно із заголовком `Idempotency-Replayed: true` протягом 7 днів. `409`: запит із цим ключем ще виконується (`idempotency_state: in_progress`) або не завершився, і його результат треба перевірити вручну (`idempotency_state: unknown`; повторно він не виконується). `422`: ключ уже використано з іншим запитом. Відповідь `429` від обмежувача частоти ключ не витрачає, повторюйте з тим самим ключем.
        * Методи саб-користувачів (створення, `data/add`, `data/subtract`): ключ передається провайдеру проксі, і повтор протягом 24 годин не змінить квоту двічі. `409`: операція ще виконується або ключ використано з іншими даними.

        Без заголовка запити виконуються як зазвичай, без цих гарантій.
      schema:
        type: string
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]+$
  responses:
    BadRequest:
      description: |
        Некоректний запит; причина в `message`. Більшість перевірок відповідає JSON (`ApiError`), деякі відповідають звичайним текстом (`Content-Type: text/plain`): `Invalid proxy type`, `User don't have active order with this proxy type`, `User resident not set for user` (методи резидентських проксі), `Addon not available for this product`, `Invalid addons_json` і перевірки кількості додаткових компонентів (методи компонентів, купівля та розрахунок із компонентами), а також помилки проксі-сервера в `signature/set` і `del-np/set`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
        text/plain:
          schema:
            type: string
            example: Invalid proxy type
    Unauthorized:
      description: 'Немає API-ключа або він недійсний: `Missing or invalid Authorization header`, `Invalid API key`, `API key mismatch`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServerError:
      description: |
        Внутрішня помилка. `500` приходить і тоді, коли замовлення (або інший потрібний запис) не знайдено чи воно не належить вашому обліковому запису; що саме, сказано в `message`, наприклад `Order not found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UpstreamError:
      description: 'Провайдер проксі недоступний або відповів помилкою (`Upstream error: <status>`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: |
        Більше одного запиту за 3 секунди від облікового запису. Тіло відповіді звичайним текстом (`Too many requests, retry in <N>s`), у заголовку `x-ratelimit-after` час очікування в секундах. Idempotency-Key не витрачається: повторюйте з тим самим ключем.
      content:
        text/plain:
          schema:
            type: string
            example: Too many requests, retry in 2s
    IdempotencyConflict:
      description: |
        Запит із цим Idempotency-Key ще виконується (`idempotency_state: in_progress`) або не завершився, і його результат треба перевірити вручну (`idempotency_state: unknown`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    IdempotencyMismatch:
      description: Цей Idempotency-Key уже використано з іншим запитом
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ActiveProxyItem:
      type: object
      properties:
        ip:
          type: string
        username:
          type: string
        password:
          type: string
        http_port:
          type: integer
        socks_port:
          type: integer
        until:
          type: string
          description: "Рядок дати ISO 8601"
        status:
          type: string
        signature:
          type: string
          nullable: true
          description: "p0f підпис, призначений для IP, нульовий, якщо не встановлено"
      required:
        - ip
        - username
        - password
        - http_port
        - socks_port
        - until
        - status
    ApiError:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        rejected:
          type: boolean
          description: 'Операції із саб-користувачами: `true`, якщо провайдер відхилив операцію і нічого не змінилося'
        idempotency_state:
          type: string
          enum:
            - in_progress
            - unknown
          description: Лише в `409` від перевірки Idempotency-Key
        order_id:
          type: integer
          description: 'Лише в `502` від купівлі та add-bandwidth: оплачене замовлення'
        refunded:
          type: boolean
          description: 'Лише в `502` від купівлі та add-bandwidth: `true`, якщо оплату повернуто на гаманець, `false`, якщо повернення ще не відбулося (зверніться до підтримки)'
      required:
        - success
        - message
    AddonLine:
      type: object
      description: "Один додатковий рядок, що зберігається в замовленні"
      properties:
        addon_key:
          type: string
        catalog_id:
          type: integer
        qty:
          type: integer
          description: "Одиниці, активні в поточному періоді"
        price_per_unit:
          type: integer
          description: "Ціна одиниці в центах на момент покупки"
        pending:
          description: "Зміна запланована на наступне оновлення або `null`"
          nullable: true
          type: object
          properties:
            action:
              type: string
              enum:
                - cancel
                - downgrade
            next_qty:
              type: integer
              description: "Цільова кількість після пониження"
    PurchaseRequestDcIsp:
      type: object
      description: "Покупка для Datacenter/ISP - поле location обов'язкове."
      properties:
        product:
          type: string
          enum:
            - Datacenter Proxy
            - ISP Proxy
        location:
          type: string
        cycle:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
        addons:
          type: array
          nullable: true
          description: "Додатки, додані під час покупки, наприклад `p0f_slots` для DC або ISP"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
        - location
        - cycle
    PurchaseRequestResidentialStandard:
      type: object
      description: "Покупка Standart Residential Proxy; location не потрібно; цикл фіксований (lifetime)."
      properties:
        product:
          type: string
          enum:
            - Standart Residential Proxy
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        addons:
          type: array
          nullable: true
          description: "Додатки, додані під час покупки, наприклад `p0f_slots` для DC або ISP"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
    PurchaseRequestResidentialPremium:
      type: object
      description: "Купівля для Premium Residential Proxy - location не потрібна; цикл фіксований (lifetime)."
      properties:
        product:
          type: string
          enum:
            - Premium Residential Proxy
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        addons:
          type: array
          nullable: true
          description: "Додатки, додані під час покупки, наприклад `p0f_slots` для DC або ISP"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
    PurchaseRequestResidentialUnmetered:
      type: object
      description: "Купівля для Unmetered Residential proxy - підтримує авто-продовження."
      properties:
        product:
          type: string
          enum:
            - Unmetered Residential proxy
        cycle:
          type: string
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
        addons:
          type: array
          nullable: true
          description: "Додатки, додані під час покупки, наприклад `p0f_slots` для DC або ISP"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
        - cycle
    PurchaseRequest:
      type: object
      properties:
        product:
          type: string
        location:
          type: string
          nullable: true
        cycle:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
        addons:
          type: array
          nullable: true
          description: "Додатки, додані під час покупки, наприклад `p0f_slots` для DC або ISP"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
        - cycle
    PurchaseResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        order_id:
          type: integer
      required:
        - success
        - message
        - order_id
    ProductWithCycles:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        cycles:
          type: array
          items:
            type: string
      required:
        - name
        - cycles
    AvailableCountResponse:
      type: object
      properties:
        country:
          type: string
        product:
          type: string
        amount:
          type: integer
      required:
        - country
        - product
        - amount
    ApiMeResponse:
      type: object
      properties:
        email:
          type: string
        active_orders:
          type: integer
        wallet_balance:
          type: integer
          description: у центах
      required:
        - email
        - active_orders
        - wallet_balance
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    AvailableCountRequest:
      type: object
      properties:
        country:
          type: string
        product:
          type: string
      required:
        - country
        - product
    AddBandwidthRequest:
      type: object
      properties:
        amount:
          type: integer
          description: Обсяг у ГБ (1 ГБ = 1 073 741 824 байт), не більше 100 000
        promo_code:
          type: string
          nullable: true
      required:
        - amount
    GetSubUsersRequest:
      type: object
      properties:
        offset:
          type: integer
          description: Зміщення (за замовчуванням 0)
        limit:
          type: integer
          description: Розмір сторінки (за замовчуванням 20)
    EditSubUserPayload:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    CreateSubUserPayload:
      type: object
      description: Потрібно вказати `data` або `data_bytes`; якщо вказано обидва, використовується `data_bytes`.
      properties:
        proxy_type:
          type: string
        name:
          type: string
        data:
          type: integer
          description: Обсяг у ГБ (1 ГБ = 1 073 741 824 байт), не більше 100 000
        data_bytes:
          type: integer
          format: int64
          description: Обсяг у байтах (точно; має пріоритет над `data`), не більше 100 000 ГБ
      required:
        - proxy_type
        - name
    ChangeSubUserPasswordPayload:
      type: object
      properties:
        proxy_type:
          type: string
      required:
        - proxy_type
    ModifyTrafficPayload:
      type: object
      description: Потрібно вказати `data` або `data_bytes`; якщо вказано обидва, використовується `data_bytes`.
      properties:
        proxy_type:
          type: string
        data:
          type: integer
          description: Обсяг у ГБ (1 ГБ = 1 073 741 824 байт), не більше 100 000
        data_bytes:
          type: integer
          format: int64
          description: Обсяг у байтах (точно; має пріоритет над `data`), не більше 100 000 ГБ
      required:
        - proxy_type
    AnalyticsSeries:
      type: object
      description: |
        Відповідь провайдера без змін. Її вигляд залежить від `kind`:
        * `overall`: `results` містять інтервали часу `{timestamp, data, requests}`, порожні інтервали приходять з нулями; на короткому вікні інтервали погодинні, на довгому подобові;
        * `domains`: `results` містять хости `{hostname, data, requests}` за спаданням `data`; `count` немає;
        * `connections`: `results` містять відкриті зараз з'єднання `{user_id, package_id, server_ip, connections}`; періоду (`timezone`, `start`, `end`) немає.
      properties:
        count:
          type: integer
          description: Усього результатів (`overall`)
        next:
          type: string
          nullable: true
          description: Посилання на наступну сторінку
        previous:
          type: string
          nullable: true
          description: Посилання на попередню сторінку
        timezone:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        results:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
                description: Початок інтервалу (`overall`)
              hostname:
                type: string
                description: Хост призначення (`domains`)
              data:
                type: integer
                format: int64
                description: Байти (`overall`, `domains`)
              requests:
                type: integer
                description: Запити (`overall`, `domains`)
              user_id:
                type: string
                description: ID облікового запису або саб-користувача (`connections`)
              package_id:
                type: string
                description: ID пакета (`connections`)
              server_ip:
                type: string
                description: IP шлюзу, на якому відкриті з'єднання (`connections`)
              connections:
                type: integer
                description: Відкритих з'єднань (`connections`)
    SubUserOrderState:
      type: object
      nullable: true
      description: Стан квоти саб-користувача ПІСЛЯ операції (null, якщо провайдер не повернув замовлення)
      properties:
        proxy_password:
          type: string
        data:
          type: integer
          format: int64
          description: Виділена квота в байтах
        data_spent:
          type: integer
          format: int64
          description: Витрачено байтів
        data_remain:
          type: integer
          format: int64
          description: Залишилось байтів (при перевитраті може бути від'ємним)
    Country:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
          description: "ISO код країни"
        name:
          type: string
          maxLength: 255
          description: "Назва країни"
      required:
        - code
        - name
    Region:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
          description: "Код регіону або штату"
        name:
          type: string
          maxLength: 255
          description: "Назва регіону або штату"
        country:
          $ref: '#/components/schemas/Country'
      required:
        - code
        - name
        - country
    City:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          description: "Код міста, зазвичай слаг"
        name:
          type: string
          maxLength: 255
          description: "Назва міста"
        country:
          $ref: '#/components/schemas/Country'
        region:
          type: object
          nullable: true
          properties:
            code:
              type: string
              maxLength: 10
              description: "Код регіону"
            name:
              type: string
              maxLength: 255
              description: "Назва регіону"
          required:
            - code
            - name
      required:
        - code
        - name
        - country
    PagedCountriesResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Country'
      required:
        - count
        - results
    PagedRegionsResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Region'
      required:
        - count
        - results
    PagedCitiesResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
        - count
        - results
    Isp:
      type: object
      properties:
        code:
          type: string
          description: "Код провайдера, зазвичай слаг"
        name:
          type: string
          description: "Ім'я провайдера"
        country:
          $ref: '#/components/schemas/Country'
        region:
          type: object
          nullable: true
          properties:
            code:
              type: string
              description: "Код регіону"
            name:
              type: string
              description: "Назва регіону"
          required:
            - code
            - name
      required:
        - code
        - name
        - country
    PagedIspsResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Isp'
      required:
        - count
        - results
    CreateOrderAddonRequest:
      type: object
      properties:
        addon_key:
          type: string
          example: p0f_slots
        qty:
          type: integer
          minimum: 1
      required:
        - addon_key
        - qty
paths:
  /user/api/proxies/active:
    get:
      tags:
        - Datacenter & ISP Proxies
      summary: Отримати активні проксі на замовлення
      parameters:
        - in: query
          name: order_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список проксі
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActiveProxyItem'
                  order_tag:
                    type: string
                    nullable: true
                required:
                  - success
                  - data
        '400':
          description: У замовлення ще немає даних доступу до проксі (`Missing authtoken in order`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Метод недоступний для цього замовлення
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /user/api/orders/{order_id}/del-np/set:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Налаштувати видалення для кожного IP (del-np)"
      description: |
        Лише для проксі дата-центрів та ISP.
        Позначені проксі працюють до кінця оплаченого періоду й видаляються під час наступного продовження. Поля замовлення `quantity` і `price_paid` зараз НЕ змінюються: продовження списує плату за проксі, що залишилися (пропорційну частку ціни замовлення), і потім оновлює їх. Див. `renewal_quantity` і `renewal_price` у GET /user/api/orders/{order_id}.
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      ip:
                        type: string
                      value:
                        type: boolean
                    required:
                      - ip
                      - value
              required:
                - items
      responses:
        '200':
          description: "Успіх"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: "Помилка перевірки / не DC-ISP / keep=0"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/signature/set:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Установити відбиток ОС для IP"
      description: "Встановлює підпис відбитка ОС для однієї або кількох IP-адрес проксі.  \nДля замовлення потрібен активний додаток `p0f_slots`.\n\nКожна IP-адреса з підписом постійно займає один слот. Зміна ОС для IP-адреси, яка вже має підпис, не потребує додаткового слота.\n\n**Доступні значення підпису:**\n\n| Значення | ОС |\n|-------|----|\n| `ios` | iOS |\n| `macos` | macOS |\n| `android` | Android |\n| `linux` | Linux |\n| `win10` | Windows 10 |\n| `win11` | Windows 11 |"
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - ip
                      - signature
                    properties:
                      ip:
                        type: string
                      signature:
                        type: string
                        description: "Ідентифікатор ОС для підробки."
                        enum:
                          - ios
                          - macos
                          - android
                          - linux
                          - win10
                          - win11
      responses:
        '200':
          description: "Успіх"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  updated:
                    type: integer
                    description: "Кількість оновлених IP-адрес"
        '400':
          description: "Помилка перевірки або недостатньо слотів"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/calculate:
    get:
      tags:
        - Datacenter & ISP Proxies
      summary: "Розрахувати додаткову вартість"
      description: "Повертає попередній перегляд ціни для придбання додаткових одиниць певного доповнення для активного замовлення центру обробки даних/провайдера. Наразі єдиним підтримуваним ключем додатка є `p0f_slots`; Слоти для підпису відбитків пальців ОС."
      parameters:
        - in: path
          name: order_id
          required: true
          description: "ID замовлення"
          schema:
            type: integer
        - in: query
          name: addon_key
          required: true
          description: "Ідентифікатор доповнення (наприклад, `p0f_slots`)"
          schema:
            type: string
        - in: query
          name: add_qty
          required: true
          description: "Кількість одиниць для додавання"
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: "Попередній перегляд ціни"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  addon_key:
                    type: string
                  catalog_id:
                    type: integer
                  price_per_unit:
                    type: integer
                    description: "Ціна за одиницю в центах"
                  current_qty:
                    type: integer
                  add_qty:
                    type: integer
                  new_qty:
                    type: integer
                  add_total:
                    type: integer
                    description: "Загальна вартість цієї покупки в центах"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/purchase:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Купити додатковий компонент"
      description: |
        Одразу списує кошти з гаманця й додає до замовлення вказану кількість одиниць додаткового компонента. Замовлення має бути **active**. Наразі доступний лише ключ `p0f_slots`.
        Надсилайте заголовок `Idempotency-Key`, щоб повтор був безпечним (списуються кошти).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: order_id
          required: true
          description: "ID замовлення"
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addon_key
                - add_qty
              properties:
                addon_key:
                  type: string
                add_qty:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: "Придбано додаток"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  addons_price_paid:
                    type: integer
                    description: "Сукупна додаткова вартість для цього замовлення (центи)"
                  addons:
                    type: array
                    description: "Оновлений список додатків зберігається в замовленні"
                    items:
                      $ref: '#/components/schemas/AddonLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Одночасно відбувалася інша зміна компонентів цього замовлення (повторіть), або запит із цим Idempotency-Key ще виконується
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/schedule:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Запланувати пониження додаткового компонента"
      description: "Планує, щоб **downgrade** доповнення набуло чинності в наступному циклі оновлення. Нова кількість має бути меншою за поточну. Зміни зберігаються як маркер `pending` і застосовуються автоматично під час оновлення замовлення."
      parameters:
        - in: path
          name: order_id
          required: true
          description: "ID замовлення"
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addon_key
                - action
              properties:
                addon_key:
                  type: string
                action:
                  type: string
                  description: '`downgrade`: зменшити кількість під час наступного продовження; `cancel`: прибрати компонент під час наступного продовження'
                  enum:
                    - downgrade
                    - cancel
                next_qty:
                  type: integer
                  description: "Обов'язковий для `downgrade`: кількість після продовження, менша за поточну (0 прибирає всі одиниці)"
                  minimum: 0
      responses:
        '200':
          description: "Заплановано пониження"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  addons:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddonLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Замовлення не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/schedule/cancel:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Скасувати заплановане зниження"
      description: "Видаляє очікування повернення, яке було встановлено через кінцеву точку розкладу."
      parameters:
        - in: path
          name: order_id
          required: true
          description: "ID замовлення"
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addon_key
              properties:
                addon_key:
                  type: string
      responses:
        '200':
          description: "Очікування повернення видалено"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  addons:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddonLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/purchase:
    post:
      tags:
        - General
      summary: Створити та сплатити замовлення
      description: |
        Купівля за назвою продукту, локацією та циклом.
        Для Datacenter/ISP location обов'язковий.
        Для Standart Residential Proxy location не потрібен.

        Надсилайте заголовок `Idempotency-Key`, щоб повтор був безпечним: без нього повтор після тайм-ауту може двічі списати кошти й видати проксі.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PurchaseRequestDcIsp'
                - $ref: '#/components/schemas/PurchaseRequestResidentialStandard'
                - $ref: '#/components/schemas/PurchaseRequestResidentialPremium'
                - $ref: '#/components/schemas/PurchaseRequestResidentialUnmetered'
                - $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '200':
          description: Успішно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          description: Помилка валідації/балансу/недолік стоку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Неавторизований
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Цей платіжний цикл недоступний для вашого облікового запису
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          description: Не вдалося перевірити наявність, або проксі не видано після оплати; тоді `order_id` і `refunded` показують, чи повернуто оплату
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /user/api/orders/calculate:
    get:
      tags:
        - General
      summary: "Розрахувати вартість замовлення"
      description: "Розраховує ціну за назвою продукту, назвою циклу та кількістю. Використовує ті самі правила перевірки, що й покупка (дозволені платіжні цикли, правила рекламної акції)."
      parameters:
        - in: query
          name: product
          required: true
          schema:
            type: string
        - in: query
          name: location
          required: false
          schema:
            type: string
            nullable: true
        - in: query
          name: cycle
          required: false
          schema:
            type: string
            nullable: true
        - in: query
          name: quantity
          required: false
          schema:
            type: integer
            nullable: true
        - in: query
          name: promo_code
          required: false
          schema:
            type: string
            nullable: true
        - in: query
          name: addons_json
          required: false
          description: "Масив JSON із кодуванням URL-адреси доповнень, напр. [{\"addon_key\":\"p0f_slots\",\"qty\":5}]"
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: "Успіх"
          content:
            application/json:
              schema:
                type: object
                properties:
                  original_price:
                    type: integer
                  final_price:
                    type: integer
                  discount_percent:
                    type: integer
                  addons_price:
                    type: integer
                    description: "Загальна вартість додаткових компонентів у мінімальних одиницях"
                  total_with_addons:
                    type: integer
                    description: final_price + addons_price
        '400':
          description: "Помилка підтвердження"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: "Потрібна авторизація"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Цей платіжний цикл недоступний для вашого облікового запису
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/change-billing-cycle/{order_id}:
