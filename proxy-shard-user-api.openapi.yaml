      tags:
        - Residential Proxies
      summary: Створити саб-користувача
      description: |
        Квота задає віртуальний ліміт поверх спільного пулу трафіку облікового запису: її призначення не списує трафік із пулу, трафік витрачається лише тоді, коли саб-користувач справді використовує проксі.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: query
          name: proxy_type
          required: true
          description: Тип проксі (standart | premium | unlimited)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Потрібно вказати `data` або `data_bytes`; якщо вказано обидва, використовується `data_bytes`.
              properties:
                name:
                  type: string
                data:
                  type: integer
                  description: Обсяг у ГБ (1 ГБ = 1 073 741 824 байт), не більше 100 000
                data_bytes:
                  type: integer
                  format: int64
                  description: Обсяг у байтах (точно; має пріоритет над `data`), не більше 100 000 ГБ
              required:
                - name
      responses:
        '200':
          description: Успішно
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: string
                        first_name:
                          type: string
                        proxy_password:
                          type: string
                        data:
                          type: integer
                        data_spent:
                          type: integer
                        data_remain:
                          type: integer
                      required:
                        - user_id
                        - first_name
                        - proxy_password
                        - data
                        - data_spent
        '400':
          description: 'Помилка перевірки, або провайдер відхилив запит (`rejected: true`); нічого не створено'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Запит із цим Idempotency-Key ще виконується або ключ використано з іншими даними
          content:
