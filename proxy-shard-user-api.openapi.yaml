          application/json:
            schema:
              type: object
              description: Потрібно вказати `data` або `data_bytes`; якщо вказано обидва, використовується `data_bytes`.
              properties:
                data:
                  type: integer
                  description: Обсяг у ГБ (1 ГБ = 1 073 741 824 байт), не більше 100 000
                data_bytes:
                  type: integer
                  format: int64
                  description: Обсяг у байтах (точно; має пріоритет над `data`), не більше 100 000 ГБ
      responses:
        '200':
          description: Успішно
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Traffic subtracted from sub user successfully
                  order:
                    $ref: '#/components/schemas/SubUserOrderState'
                required:
                  - success
                  - message
        '400':
          description: 'Помилка перевірки, або провайдер відхилив операцію (`rejected: true`); квота НЕ змінилася'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Запит із цим Idempotency-Key ще виконується або ключ використано з іншими даними
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          description: 'Провайдер недоступний: результат НЕВІДОМИЙ; повторіть із тим самим Idempotency-Key'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
