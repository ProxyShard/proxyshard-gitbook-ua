  /user/api/proxies/analytics/{kind}:
    get:
      tags:
        - Residential Proxies
      summary: Статистика облікового запису
      description: |
        Статистика трафіку самого облікового запису.

        `kind`:
        * `overall`: трафік і запити за інтервалами за період;
        * `domains`: трафік і запити за хостами призначення за період;
        * `connections`: з'єднання, відкриті просто зараз (без періоду).

        За замовчуванням враховується лише власний трафік облікового запису. Передайте `include_sub_users=true`, щоб додати всіх саб-користувачів облікового запису.
      parameters:
        - in: path
          name: kind
          required: true
          description: overall | domains | connections
          schema:
            type: string
            enum:
              - overall
              - domains
              - connections
        - in: query
          name: proxy_type
          required: true
          description: Тип проксі (standart | premium | unlimited)
          schema:
            type: string
        - in: query
          name: start
          required: false
          description: Початок вікна, включно (ISO 8601, `YYYY-MM-DD HH:MM:SS` або Unix timestamp). Для `connections` не враховується.
          schema:
            type: string
        - in: query
          name: end
          required: false
          description: Кінець вікна, не включно; за замовчуванням поточний момент. Для `connections` не враховується.
          schema:
            type: string
        - in: query
          name: timezone
          required: false
          description: Часовий пояс IANA для меж інтервалів, за замовчуванням UTC
          schema:
            type: string
        - in: query
          name: include_sub_users
          required: false
          description: Враховувати обліковий запис разом з усіма його саб-користувачами (за замовчуванням false)
          schema:
            type: boolean
        - in: query
          name: limit
          required: false
          description: Розмір сторінки
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          description: Скільки результатів пропустити
          schema:
            type: integer
      responses:
        '200':
          description: Успішно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
